# Keeps pinned dependencies current. Actions are pinned to commit SHAs with a
# "# vX.Y.Z" comment; Dependabot updates both. Every update is a pull request
# that runs CI and the secret scan like any other change.
#
# One grouped pull request per ecosystem per week, so updates arrive as a few
# reviewable PRs rather than a branch per package. Major versions (Preact 11,
# Node 25, and so on) are left for a deliberate upgrade: they change behaviour,
# and Node's odd-numbered majors never become long-term-support releases.
#
# Cooldown: a release is proposed only once it is a week old, so a hijacked or broken
# release that is caught and yanked in its first days never reaches a pull request.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 7 }
    groups:
      actions: { patterns: ["*"] }

  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 7 }
    open-pull-requests-limit: 3
    groups:
      npm-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  # One Cargo workspace at the root (Cargo.toml, Cargo.lock): every crate's update lands in
  # the one lockfile the builds use.
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 7 }
    open-pull-requests-limit: 3
    groups:
      cargo-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  - package-ecosystem: docker
    directories: [/services, /services/edge]
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 7 }
    groups:
      base-images: { patterns: ["*"] }
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
