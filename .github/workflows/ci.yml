name: CI

# Every push / PR:
#   1. unit, protocol, end-to-end and penetration-regression tests (all services in-process)
#   2. compile only the app platforms the change touches
#   3. build only the service images the change touches, then boot the whole
#      stack with docker compose and run the smoke test against it over TLS
#   4. build HumID Server for Windows, install it on a Windows runner from the
#      zip (as a person would), smoke-test, back up, restore, update, test the
#      admin console and its jobs (tests/windows/admin-console.ps1), uninstall
#   5. the app in Chromium: "Scan an ID" and "Take a photo" with a fake camera, getting
#      set up, offline mode, managing the server, Check-in, the phone's document scanner (tests/browser/idscan.mjs, guided.mjs, photo.mjs, scanfeedback.mjs, setup.mjs, offline.mjs, admin.mjs, checkin.mjs, docscan.mjs)
# tools/affected.mjs decides what "touches" means.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: # manual run: everything

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-22.04
    outputs:
      apps: ${{ steps.affected.outputs.apps }}
      services: ${{ steps.affected.outputs.services }}
      anyApps: ${{ steps.affected.outputs.anyApps }}
      anyServices: ${{ steps.affected.outputs.anyServices }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Tests (crypto compatibility, HTP/1 protocol, services end to end, penetration regression)
        # A failure names the failing tests in an annotation (readable through the API without the log).
        run: |
          set -o pipefail
          { npm test && npm run test:e2e && npm run test:pen; } 2>&1 | tee tests.log && exit 0
          echo "::error title=tests failed::$(grep -A14 '^not ok' tests.log | grep -E 'not ok|error:|expected|actual|code:|at .*test\.js' | head -30 | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' | cut -c1-3800)"
          exit 1
        env: { NODE_NO_WARNINGS: "1" }
      - name: Build the app bundle (module contract check included)
        run: npm run build:app
      - name: Work out what this change affects
        id: affected
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          BASE="${PR_BASE:-HEAD~1}"
          if [ "$EVENT" = "workflow_dispatch" ]; then BASE=none; fi
          OUT=$(node tools/affected.mjs "$BASE")
          echo "$OUT" | jq .
          echo "apps=$(echo "$OUT" | jq -c .appMatrix)" >> "$GITHUB_OUTPUT"
          echo "services=$(echo "$OUT" | jq -c .serviceMatrix)" >> "$GITHUB_OUTPUT"
          echo "anyApps=$(echo "$OUT" | jq '.platforms | length > 0')" >> "$GITHUB_OUTPUT"
          echo "anyServices=$(echo "$OUT" | jq '.services | length > 0')" >> "$GITHUB_OUTPUT"

  # The release workflow runs the unit tests on Windows before building the Windows app, so a
  # test that only fails there (a path with \ instead of /) blocks a release. Catch it here.
  # Each failing test becomes an annotation on the check, readable without the log.
  test-windows:
    needs: test
    if: needs.test.outputs.anyApps == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Unit tests on Windows (as the release runs them)
        shell: pwsh
        env: { NODE_NO_WARNINGS: "1" }
        run: |
          node --test --test-reporter=tap tests/*.test.js 2>&1 | Tee-Object -FilePath tap.txt | Out-Null
          $code = $LASTEXITCODE
          Get-Content tap.txt | Select-String '^# (tests|pass|fail)' | ForEach-Object { $_.Line }
          if ($code) {
            $lines = Get-Content tap.txt
            for ($i = 0; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -match '^\s*not ok \d+ - (.*)') {
                $name = $Matches[1]
                $detail = ($lines[($i + 1)..([Math]::Min($i + 40, $lines.Count - 1))] | Where-Object { $_ -match "error:|expected|actual|location:|\.test\.js:" } | Select-Object -First 6) -join ' | '
                Write-Output "::error title=Windows unit test failed::$name | $detail"
              }
            }
            exit $code
          }

  app:
    needs: test
    if: needs.test.outputs.anyApps == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.test.outputs.apps) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-15; toolchain set below
        with:
          toolchain: 1.99.1 # = rust-toolchain.toml
          targets: ${{ matrix.platform == 'ios' && 'aarch64-apple-ios' || matrix.platform == 'android' && 'aarch64-linux-android' || '' }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: { workspaces: apps/mobile/src-tauri }
      - name: Linux system libraries
        if: matrix.platform == 'linux' || matrix.platform == 'android'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libdbus-1-dev
      - name: Android NDK
        if: matrix.platform == 'android'
        id: ndk
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1.6.0
        with: { ndk-version: r27c }
      - name: Android NDK toolchain on PATH
        if: matrix.platform == 'android'
        env:
          NDK_PATH: ${{ steps.ndk.outputs.ndk-path }}
        run: echo "$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"
      - run: npm run build:app
      - name: Compile (desktop)
        if: contains(fromJson('["macos","windows","linux"]'), matrix.platform)
        working-directory: apps/mobile/src-tauri
        shell: bash
        run: ../../../tools/ci-cargo.sh build
      - name: Compile (iOS library)
        if: matrix.platform == 'ios'
        working-directory: apps/mobile/src-tauri
        run: ../../../tools/ci-cargo.sh build --target aarch64-apple-ios --lib
      - name: Compile (Android library)
        if: matrix.platform == 'android'
        working-directory: apps/mobile/src-tauri
        env:
          CC_aarch64_linux_android: aarch64-linux-android24-clang
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: aarch64-linux-android24-clang
        run: ../../../tools/ci-cargo.sh build --target aarch64-linux-android --lib

  # The chip reader end to end through real native code: the shared ICAO 9303 reader drives
  # tauri-plugin-humid-nfc's PC/SC transport, through pcscd, to a simulated passport chip in a
  # virtual reader (vsmartcard vpcd). Then the server's own checks verify what was read.
  chip-reader:
    needs: test
    runs-on: ubuntu-24.04 # pcsc-lite 2 (--disable-polkit) and vsmartcard 0.9
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-15; toolchain set below
        with: { toolchain: 1.99.1 } # = rust-toolchain.toml
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: { workspaces: plugins/humid-nfc }
      - name: PC/SC daemon, virtual reader, Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev libpcsclite-dev pcscd vsmartcard-vpcd
      - name: Build the reader bridge (the plugin's real PC/SC code, without Tauri)
        working-directory: plugins/humid-nfc
        run: ../../tools/ci-cargo.sh build --example apdu-bridge --features pcsc-linux
      - name: Start pcscd with the virtual reader
        run: |
          sudo systemctl stop pcscd.socket pcscd.service 2>/dev/null || true
          sudo pcscd --foreground --disable-polkit > pcscd.log 2>&1 &
          for i in $(seq 1 30); do (echo > /dev/tcp/127.0.0.1/35963) 2>/dev/null && exit 0; sleep 0.5; done
          echo "::error::pcscd / vpcd didn't start: $(tail -20 pcscd.log | tr '\n' ' ')"; exit 1
      - name: Read a chip through the native transport
        run: |
          node --test tests/e2e/pcsc.test.js > pcsc-test.log 2>&1 && exit 0
          cat pcsc-test.log
          echo "::error::$(grep -E 'error:|Error|expected|actual' pcsc-test.log | head -12 | tr '\n' ' ') pcscd: $(tail -8 pcscd.log | tr '\n' ' ')"; exit 1
        env: { NODE_NO_WARNINGS: "1", HUMID_REQUIRE_PCSC: "1" }

  id-scan:
    name: id-scan (browser)
    needs: test
    runs-on: ubuntu-22.04
    timeout-minutes: 25 # the checks take ~8 min; a stuck browser fails fast instead of holding the run
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Chromium for the browser check
        run: npm i --no-save --no-audit --no-fund playwright@1.56.0 && npx playwright install --with-deps chromium
      - name: Scan an ID with a fake camera (barcode, live MRZ, simulated chip, seal, open)
        run: |
          node tests/browser/idscan.mjs > idscan.log 2>&1 && { grep -v '^{"t"' idscan.log; exit 0; }
          grep -v '^{"t"' idscan.log | tail -60
          echo "::error::$(grep -v '^{"t"' idscan.log | grep -E 'Error|expected|actual|assert|waiting for|idscan.mjs:' | head -8 | tr '\n' ' ')"; exit 1
        env: { NODE_NO_WARNINGS: "1", SHOTS: "idscan-shots" }
      - name: Getting set up (small phones, seal-card check, protection checklist, 44 px targets, pinned server)
        run: |
          node tests/browser/setup.mjs > setup.log 2>&1 && { grep -v '^{"t"' setup.log; exit 0; }
          grep -v '^{"t"' setup.log | tail -60
          echo "::error::$(grep -v '^{"t"' setup.log | grep -E 'Error|expected|actual|assert|off screen|under 44|waiting for|setup.mjs:' | head -8 | tr '\n' ' ')"; exit 1
        env: { NODE_NO_WARNINGS: "1", SHOTS: "idscan-shots/setup" }
      - name: Offline, read only (sealed copy, no network, server down, duress, reconnect)
        run: |
          node tests/browser/offline.mjs > offline.log 2>&1 && { grep -v '^{"t"' offline.log; exit 0; }
          grep -v '^{"t"' offline.log | tail -60
          echo "::error::$(grep -v '^{"t"' offline.log | grep -E 'Error|expected|actual|assert|readable|waiting for|offline.mjs:' | head -8 | tr '\n' ' ')"; exit 1
        env: { NODE_NO_WARNINGS: "1", SHOTS: "idscan-shots/offline" }
      - name: Take a photo (finds a tilted page anywhere in view, straightens and turns it, location stamp)
        run: |
          node tests/browser/photo.mjs > photo.log 2>&1 && { grep -v '^{"t"' photo.log; exit 0; }
          grep -v '^{"t"' photo.log | tail -60
          echo "::error::$(grep -v '^{"t"' photo.log | grep -E 'Error|expected|actual|assert|readable|waiting for|photo.mjs:' | head -8 | tr '\n' ' ')"; exit 1
        env: { NODE_NO_WARNINGS: "1", SHOTS: "idscan-shots/photo" }
      - name: The camera says what it is doing (Looking, Hold steady, Reading, Verifying, Done; the 10 s offer, the 30 s stop; worker)
        run: |
          node tests/browser/scanfeedback.mjs > scanfeedback.log 2>&1 && { grep -v '^{"t"' scanfeedback.log; exit 0; }
          grep -v '^{"t"' scanfeedback.log | tail -60
          echo "::error::$(grep -v '^{"t"' scanfeedback.log | grep -E 'Error|expected|actual|assert|waiting for|scanfeedback.mjs:' | head -8 | tr '\n' ' ')"; exit 1
        env: { NODE_NO_WARNINGS: "1", SHOTS: "idscan-shots/scanfeedback" }
      - name: Guided scan (fixed outline per document, plain-word guidance, auto and manual capture, crop to the outline, takePhoto stand-in; fake camera)
        run: |
          node tests/browser/guided.mjs > guided.log 2>&1 && { grep -v '^{"t"' guided.log; exit 0; }
          grep -v '^{"t"' guided.log | tail -60
          echo "::error::$(grep -v '^{"t"' guided.log | grep -E 'Error|expected|actual|assert|waiting for|guided.mjs:' | head -8 | tr '\n' ' ')"; exit 1
        env: { NODE_NO_WARNINGS: "1", SHOTS: "idscan-shots/guided" }
      - name: The phone's document scanner (Android; license and passport read from the scanned page, back out, scan again, no scanner falls back to the camera)
        run: |
          node tests/browser/docscan.mjs > docscan.log 2>&1 && { grep -v '^{"t"' docscan.log; exit 0; }
          grep -v '^{"t"' docscan.log | tail -60
          echo "::error::$(grep -v '^{"t"' docscan.log | grep -E 'Error|expected|actual|assert|waiting for|docscan.mjs:' | head -8 | tr '\n' ' ')"; exit 1
        env: { NODE_NO_WARNINGS: "1", SHOTS: "idscan-shots/docscan" }
      - name: Payment cards and Wallet passes (front and back read by the camera, masked, no copying; pass signatures)
        run: |
          node tests/browser/cards.mjs > cards.log 2>&1 && { grep -v '^{"t"' cards.log; exit 0; }
          grep -v '^{"t"' cards.log | tail -60
          echo "::error::$(grep -v '^{"t"' cards.log | grep -E 'Error|expected|actual|assert|waiting for|cards.mjs:' | head -8 | tr '\n' ' ')"; exit 1
        env: { NODE_NO_WARNINGS: "1", SHOTS: "idscan-shots/cards" }
      - name: Managing the server (admin console + app; enrol a phone, approve a change)
        run: |
          node tests/browser/admin.mjs > admin.log 2>&1 && { grep -v '^{"t"' admin.log; exit 0; }
          grep -v '^{"t"' admin.log | tail -60
          echo "::error::$(grep -v '^{"t"' admin.log | grep -E 'Error|expected|actual|assert|waiting for|admin.mjs:' | head -8 | tr '\n' ' ')"; exit 1
        env: { NODE_NO_WARNINGS: "1", SHOTS: "idscan-shots/admin" }
      - name: Check-in (turn on, check in, a longer night window, duress erases, decoy stays)
        run: |
          node tests/browser/checkin.mjs > checkin.log 2>&1 && { grep -v '^{"t"' checkin.log; exit 0; }
          grep -v '^{"t"' checkin.log | tail -60
          echo "::error::$(grep -v '^{"t"' checkin.log | grep -E 'Error|expected|actual|assert|waiting for|checkin.mjs:' | head -8 | tr '\n' ' ')"; exit 1
        env: { NODE_NO_WARNINGS: "1", SHOTS: "idscan-shots/checkin" }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with: { name: idscan-shots, path: idscan-shots, if-no-files-found: ignore, retention-days: 7 }

  images:
    needs: test
    if: needs.test.outputs.anyServices == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.test.outputs.services) }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build humid-${{ matrix.service }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ${{ matrix.service == 'edge' && 'services/edge/Dockerfile' || 'services/Dockerfile' }}
          build-args: SERVICE=${{ matrix.service }}
          tags: humid-${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          outputs: type=docker,dest=/tmp/humid-${{ matrix.service }}.tar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: "image-${{ matrix.service }}", path: "/tmp/humid-${{ matrix.service }}.tar", retention-days: 1 }

  stack:
    needs: [test, images]
    if: needs.test.outputs.anyServices == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { pattern: "image-*", path: /tmp/images, merge-multiple: true }
      - name: Load images built in this run; build the rest
        working-directory: deploy
        run: |
          for t in /tmp/images/*.tar; do docker load -i "$t"; done
          for s in gateway identity vault ledger recovery access keyshare edge; do
            if docker image inspect "humid-$s:ci" >/dev/null 2>&1; then docker tag "humid-$s:ci" "local/humid-$s:ci"; fi
          done
          node ../services/gateway/src/server.js keygen 2>/dev/null > .env || true
          echo "HUMID_DOMAIN=localhost" >> .env
          export HUMID_REGISTRY=local HUMID_VERSION=ci
          missing=$(for s in gateway identity vault ledger recovery access keyshare edge; do docker image inspect "local/humid-$s:ci" >/dev/null 2>&1 || echo $s; done)
          if [ -n "$missing" ]; then docker compose build --pull $missing; fi
      - name: Boot the stack (docker compose)
        working-directory: deploy
        env: { HUMID_REGISTRY: local, HUMID_VERSION: ci }
        run: |
          docker compose up -d
          for i in $(seq 1 40); do curl -skf https://localhost/healthz >/dev/null && break; sleep 3; done
          docker compose ps
      - name: Smoke test over TLS + HTP/1 (default policy refuses devices without hardware proof, and accounts without a pass)
        env: { NODE_TLS_REJECT_UNAUTHORIZED: "0", NODE_NO_WARNINGS: "1", HUMID_REGISTRY: local, HUMID_VERSION: ci } # Caddy's local CA in CI only
        run: |
          curl -sk https://localhost/ | grep -q '<div id="app">'
          node tests/smoke.mjs https://localhost
          # with an access code: the pass is spent, the unproven device refused, and the pass refunded
          code=$(cd deploy && docker compose run --rm --no-deps access server.mjs mint 1 ci | tail -1)
          node tests/smoke.mjs https://localhost "$code"
      - name: Smoke test, full flow (gateway switched to HUMID_DEVICE_POLICY=biometric)
        env: { NODE_TLS_REJECT_UNAUTHORIZED: "0", NODE_NO_WARNINGS: "1", HUMID_REGISTRY: local, HUMID_VERSION: ci }
        run: |
          (cd deploy && HUMID_DEVICE_POLICY=biometric docker compose up -d gateway)
          for i in $(seq 1 40); do curl -skf https://localhost/healthz >/dev/null && break; sleep 3; done
          code=$(cd deploy && docker compose run --rm --no-deps access server.mjs mint 1 ci | tail -1)
          node tests/smoke.mjs https://localhost "$code"
      - name: Logs on failure
        if: failure()
        working-directory: deploy
        env: { HUMID_REGISTRY: local, HUMID_VERSION: ci }
        run: docker compose logs --no-color | tail -200

  windows-server:
    needs: test
    if: needs.test.outputs.anyServices == 'true'
    runs-on: windows-latest
    env:
      HUMID: C:\Program Files\HumID Server\humid.ps1
      NODE_NO_WARNINGS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Build HumID Server for Windows
        run: node deploy/windows/build.mjs --zip
      - name: Install from the zip (Windows PowerShell 5.1; fetches Node.js from nodejs.org, checksum verified)
        shell: cmd
        run: |
          powershell -NoProfile -Command "Expand-Archive -Path (Get-ChildItem deploy\windows\out\HumID-Server-Windows-*.zip).FullName -DestinationPath $env:RUNNER_TEMP\pkg"
          powershell -NoProfile -ExecutionPolicy Bypass -File "%RUNNER_TEMP%\pkg\HumID-Server\humid.ps1" install -Quiet
      - name: Runs as LOCAL SERVICE; data readable only by admins and the server
        shell: pwsh
        run: |
          $t = Get-ScheduledTask -TaskName 'HumID Server'
          $t.Principal.UserId
          if ($t.Principal.UserId -notmatch 'LOCAL ?SERVICE') { throw "task runs as $($t.Principal.UserId)" }
          icacls C:\ProgramData\HumID
          $acl = (Get-Acl C:\ProgramData\HumID).Access | ForEach-Object { $_.IdentityReference.Value }
          if ($acl -match 'Users|Everyone') { throw "data folder is readable by: $($acl -join ', ')" }
          powershell -NoProfile -ExecutionPolicy Bypass -File $env:HUMID status
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Smoke test, default policy (refuses devices without hardware proof)
        run: node tests/smoke.mjs http://127.0.0.1:8480
      - name: Smoke test, full flow (humid set HUMID_DEVICE_POLICY=biometric; humid mint pays for the account)
        shell: pwsh
        run: |
          $kid = (Get-Content C:\ProgramData\HumID\server.json | ConvertFrom-Json).kid
          powershell -NoProfile -ExecutionPolicy Bypass -File $env:HUMID set HUMID_DEVICE_POLICY=biometric
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $code = (powershell -NoProfile -ExecutionPolicy Bypass -File $env:HUMID mint 1 ci | Select-String 'HA-[0-9A-Z-]+' | Select-Object -Last 1).Matches.Value
          if (-not $code) { throw "humid mint printed no access code" }
          $out = node tests/smoke.mjs http://127.0.0.1:8480 $code
          $out
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if (-not ($out -match 'blind-signed pass')) { throw "the full flow didn't run with an access pass" }
          $after = (Get-Content C:\ProgramData\HumID\server.json | ConvertFrom-Json).kid
          if ($after -ne $kid) { throw "server identity changed on restart" }
      - name: Encrypted backup (keyshare apart), restore with the key file, and update in place keep the server's identity
        shell: pwsh
        run: |
          # On failure: say which check and what humid printed last, as an annotation (readable without the log).
          $script:last = ''
          trap {
            $m = ($script:last -replace "`r?`n", ' | ')
            if ($m.Length -gt 1500) { $m = '...' + $m.Substring($m.Length - 1500) }
            Write-Host "::error title=Encrypted backup step::$($_.Exception.Message) (line $($_.InvocationInfo.ScriptLineNumber)). Last humid output: $m"
            exit 1
          }
          # (not H: in PowerShell that's the Get-History alias, and aliases beat functions)
          function Invoke-Humid { $o = & powershell -NoProfile -ExecutionPolicy Bypass -File $env:HUMID @args 2>&1 | Out-String; $code = $LASTEXITCODE; $script:last = $o; Write-Host $o; return $code }
          $kid = (Get-Content C:\ProgramData\HumID\server.json | ConvertFrom-Json).kid
          $usb = Join-Path $env:RUNNER_TEMP 'usb'
          New-Item -ItemType Directory -Force -Path $usb | Out-Null
          $b = "$env:RUNNER_TEMP\b.humidbak"; $k = "$usb\keyshare.humidbak"; $key = "$usb\humid-backup.key"
          if ((Invoke-Humid backup -Path "$env:RUNNER_TEMP\early.humidbak") -eq 0) { throw 'a backup ran without a backup key' }
          if (Test-Path "$env:RUNNER_TEMP\early.humidbak") { throw 'a plain backup was written' }
          if ((Invoke-Humid backup-key new -Path 'C:\ProgramData\HumID\data\k.key') -eq 0 -or (Test-Path 'C:\ProgramData\HumID\data\k.key')) { throw 'the backup key went inside the data folder' }
          if (Invoke-Humid backup-key new -Path $key) { throw 'backup-key new failed' }
          if (Select-String -LiteralPath 'C:\ProgramData\HumID\admin\admin.env' -Pattern '"seed"' -SimpleMatch -Quiet) { throw 'the private key is on the server' }
          if (Invoke-Humid backup -Path $b -KeysharePath $k) { throw 'backup failed' }
          if (-not (Test-Path $b) -or -not (Test-Path $k)) { throw 'backup files missing' }
          foreach ($f in $b, $k) { if (Select-String -LiteralPath $f -Pattern 'HUMID_INTERNAL_SK' -SimpleMatch -Quiet) { throw "$f holds the settings in the clear" } }
          if ((Invoke-Humid restore -Path $b -KeysharePath $k -Quiet) -eq 0) { throw 'restored without the backup key file' }
          if ((Invoke-Humid restore -Path $b -Key $key -Quiet) -eq 0) { throw 'restored without keyshare''s half' }
          if (Invoke-Humid restore -Path $b -KeysharePath $k -Key $key -Quiet) { throw 'restore failed' }
          if (-not (Test-Path 'C:\ProgramData\HumID\data\keyshare\share-key.bin')) { throw 'keyshare''s data not restored' }
          $script:last = & powershell -NoProfile -ExecutionPolicy Bypass -File "$env:RUNNER_TEMP\pkg\HumID-Server\humid.ps1" install -Quiet 2>&1 | Out-String
          $code = $LASTEXITCODE; Write-Host $script:last
          if ($code) { throw "reinstall failed (exit $code)" }
          $after = (Get-Content C:\ProgramData\HumID\server.json | ConvertFrom-Json).kid
          if ($after -ne $kid) { throw "server identity changed" }
          $script:last = node tests/smoke.mjs http://127.0.0.1:8480 2>&1 | Out-String
          $code = $LASTEXITCODE; Write-Host $script:last
          if ($code) { throw "smoke test failed after restore (exit $code)" }
      - name: Check-in guard (with vaults armed, humid commands that stop the server wait for a typed ERASE)
        shell: pwsh
        run: |
          $ps = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          $status = 'C:\ProgramData\HumID\server-status.json'
          $empty = (New-TemporaryFile).FullName
          function Humid([string[]]$Arguments) {
            $o = "$env:RUNNER_TEMP\guard-out.txt"; $e = "$env:RUNNER_TEMP\guard-err.txt"
            $p = Start-Process -FilePath $ps -ArgumentList (@('-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', "`"$env:HUMID`"") + $Arguments) `
              -RedirectStandardInput $empty -RedirectStandardOutput $o -RedirectStandardError $e -NoNewWindow -PassThru
            $null = $p.Handle   # so ExitCode is kept
            if (-not $p.WaitForExit(180000)) { $p.Kill(); throw "humid $($Arguments -join ' ') hung (waiting for input?)" }
            $out = @((Get-Content -LiteralPath $o -Raw), (Get-Content -LiteralPath $e -Raw)) -join "`n"
            Write-Host $out
            return [pscustomobject]@{ Code = $p.ExitCode; Out = $out }
          }
          $r = Humid @('stop')
          if ($r.Code) { throw "stop failed with nothing armed (exit $($r.Code))" }
          # The server is stopped, so nothing rewrites its status file: pretend two vaults are armed.
          @{ at = (Get-Date).ToUniversalTime().ToString('o'); checkin = @{ armed = 2 } } | ConvertTo-Json | Set-Content -LiteralPath $status
          $r = Humid @('restart')
          if ($r.Code -eq 0) { throw 'restart went ahead with vaults armed and no ERASE typed' }
          if ($r.Out -notmatch '2 vaults are armed') { throw 'no armed-vault warning' }
          if ((Get-ScheduledTask -TaskName 'HumID Server').State -eq 'Running') { throw 'the server was started anyway' }
          $r = Humid @('set', 'HUMID_CHECKIN=on')
          if ($r.Code -eq 0) { throw 'set went ahead with vaults armed' }
          if (Select-String -LiteralPath 'C:\ProgramData\HumID\humid.env' -Pattern '^\s*HUMID_CHECKIN\s*=\s*on' -Quiet) { throw 'set changed the setting anyway' }
          $r = Humid @('restart', '-Quiet')
          if ($r.Code) { throw "restart -Quiet failed (exit $($r.Code))" }
          if ($r.Out -notmatch 'Going ahead') { throw 'no armed-vault warning with -Quiet' }
          # The running server writes its own count again (none armed).
          $deadline = (Get-Date).AddSeconds(60); $armed = 2
          while ((Get-Date) -lt $deadline -and $armed -ne 0) {
            try { $armed = (Get-Content -LiteralPath $status -Raw | ConvertFrom-Json).checkin.armed } catch {}
            if ($armed -ne 0) { Start-Sleep -Seconds 2 }
          }
          if ($armed -ne 0) { throw "the server didn't rewrite server-status.json (armed: $armed)" }
          node tests/smoke.mjs http://127.0.0.1:8480
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Admin console (SYSTEM, 127.0.0.1 only), sign-in link, jobs, update with automatic rollback, rollback
        shell: pwsh
        run: ./tests/windows/admin-console.ps1 -Repo $env:GITHUB_WORKSPACE
      - name: Uninstall removes the tasks and, with -RemoveData, the data
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File $env:HUMID uninstall -RemoveData -Quiet
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          foreach ($n in 'HumID Server', 'HumID Admin', 'HumID Admin Job') { if (Get-ScheduledTask -TaskName $n -ErrorAction SilentlyContinue) { throw "task $n still registered" } }
          if (Test-Path 'C:\Program Files\HumID Server') { throw 'program folder still there' }
          if (Test-Path 'C:\ProgramData\HumID') { throw 'data still there' }
      - name: Log on failure
        if: failure()
        shell: pwsh
        run: |
          Get-ScheduledTaskInfo -TaskName 'HumID Server' -ErrorAction SilentlyContinue | Format-List
          Get-ScheduledTaskInfo -TaskName 'HumID Admin' -ErrorAction SilentlyContinue | Format-List
          Get-ScheduledTaskInfo -TaskName 'HumID Admin Job' -ErrorAction SilentlyContinue | Format-List
          Get-Content C:\ProgramData\HumID\logs\humid-server.log -Tail 150 -ErrorAction SilentlyContinue
          Get-Content C:\ProgramData\HumID\admin\logs\humid-admin.log -Tail 80 -ErrorAction SilentlyContinue
          Get-ChildItem C:\ProgramData\HumID\admin\jobs -Filter *.json -ErrorAction SilentlyContinue | ForEach-Object { $_.Name; Get-Content $_.FullName }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: HumID-Server-Windows
          path: deploy/windows/out/HumID-Server-Windows-*.zip
