name: CI

# Every push / PR:
#   1. unit, protocol, end-to-end and penetration-regression tests (all services in-process)
#   2. rust: cargo fmt --check, clippy -D warnings, cargo test, cargo-deny (deny.toml)
#   3. when app or plugin code changed: compile the iPhone app (Rust + the plugins' Swift)
#      and build the Android app (Rust + the plugins' Kotlin, Gradle, unsigned debug APK)
#   4. when server code changed: build every service image, boot the whole stack with
#      docker compose and run the smoke test against it over TLS; and build HumID Server
#      for Windows, install it on a Windows runner from the zip (as a person would),
#      smoke-test, back up, restore, update, test the admin console and its jobs
#      (tests/windows/admin-console.ps1), uninstall
#   5. the app in Chromium: "Scan an ID" and "Take a photo" with a fake camera, getting
#      set up, offline mode, managing the server, Check-in, the phone's document scanner (tests/browser/idscan.mjs, guided.mjs, photo.mjs, scanfeedback.mjs, setup.mjs, offline.mjs, admin.mjs, checkin.mjs, docscan.mjs)
#   6. zizmor on the workflows (codeql.yml runs CodeQL)
# The `changes` job decides what changed, by path. Desktop apps are paused for 5.0, so
# no desktop app is compiled.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: # manual run: everything

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # What changed, by path (git diff against the PR base, or the previous commit on main).
  # A manual run, or a diff git can't make (a new branch, a force-push), counts as everything.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      apps: ${{ steps.c.outputs.apps }}
      server: ${{ steps.c.outputs.server }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0, persist-credentials: false }
      - id: c
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base="${PR_BASE:-$BEFORE}"
          if [ "$EVENT" = "workflow_dispatch" ] || ! files=$(git diff --name-only "$base"...HEAD 2>/dev/null); then
            echo "apps=true" >> "$GITHUB_OUTPUT"; echo "server=true" >> "$GITHUB_OUTPUT"; echo "everything"; exit 0
          fi
          printf '%s\n' "$files"
          # shared: anything both the apps and the servers are built from
          shared='^(packages/|package(-lock)?\.json$|\.github/workflows/ci\.yml$)'
          apps='^(apps/mobile/|plugins/|crates/|Cargo\.(toml|lock)$|rust-toolchain\.toml$|tools/ci-cargo\.sh$)'
          server='^(services/|deploy/|server/|tests/smoke\.mjs$|tests/windows/|\.dockerignore$|apps/mobile/)'
          echo "apps=$(grep -qE "$shared|$apps" <<< "$files" && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "server=$(grep -qE "$shared|$server" <<< "$files" && echo true || echo false)" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # Yubico's python-fido2: the reference client the simulated security key is checked against.
      # The runner's system cryptography (3.4.8) satisfies fido2's range but is too old for it: pin a current one.
      - run: python3 -m pip install --user fido2==1.2.0 cryptography==44.0.3
      - name: Tests (crypto compatibility, HTP/1 protocol, services end to end, penetration regression)
        # A failure names the failing tests in an annotation (readable through the API without the log).
        run: |
          set -o pipefail
          { npm test && npm run test:e2e && npm run test:pen; } 2>&1 | tee tests.log && exit 0
          echo "::error title=tests failed::$(grep -A14 '^not ok' tests.log | grep -E 'not ok|error:|expected|actual|code:|at .*test\.js' | head -30 | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' | cut -c1-3800)"
          exit 1
        env: { NODE_NO_WARNINGS: "1", HUMID_REQUIRE_FIDO2: "1" }
      - name: Timing check, messaging primitives (informational on shared runners)
        # Security audit: "add a timing test to CI". Welch's t-test, valid vs invalid
        # ML-KEM ciphertexts and X25519 scalars. Shared runners are noisy, so a hit
        # warns instead of failing; reproduce it on quiet hardware before acting.
        continue-on-error: true
        run: npm run test:timing -- 20000
      - name: Build the app bundle (module contract check included)
        run: npm run build:app

  # (test-windows, which re-ran the whole unit suite on Windows because the release built the
  # Windows app, is gone with the desktop apps; the Windows server keeps windows-server below.)

  # The whole Cargo workspace on Linux: formatting, clippy with warnings as errors, the tests,
  # and cargo-deny (RustSec advisories, licences, sources: deny.toml). The app shell's lib
  # compiles here for the host (its iOS and Android builds are in `app`).
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: npm }
      - run: npm ci --ignore-scripts
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-15; toolchain set below
        with: { toolchain: 1.99.1, components: "rustfmt, clippy" } # = rust-toolchain.toml
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: { key: rust }
      - name: Linux system libraries (Tauri's WebKitGTK; the gate's D-Bus; PC/SC for the reader bridge)
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev libpcsclite-dev
      # generate_context!() embeds the web app, so the shell crate needs apps/mobile/dist
      - run: npm run build:app
      - name: cargo fmt --check
        run: cargo fmt --all --check
      - name: cargo clippy (warnings are errors)
        run: tools/ci-cargo.sh clippy --workspace --all-targets --features tauri-plugin-humid-nfc/pcsc-linux -- -D warnings
      - name: cargo test
        run: tools/ci-cargo.sh test --workspace --features tauri-plugin-humid-nfc/pcsc-linux
      - name: cargo-deny (advisories, licences, bans, sources)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with: { command: check, arguments: --all-features }

  # Static analysis of the workflows themselves (template injection, credential persistence,
  # cache poisoning, excessive permissions, unpinned actions...). Offline audits only, and no
  # SARIF upload: code scanning isn't enabled on this private repository, so findings fail the
  # job and show in its log. Known, accepted findings are in .github/zizmor.yml.
  zizmor:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          version: 1.31.1
          online-audits: false
          advanced-security: false
          min-severity: low

  # Starts with the tests rather than after them: the native builds are the longest jobs.
  app:
    needs: changes
    if: needs.changes.outputs.apps == 'true'
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: ios, runner: macos-26 } # = release.yml (Xcode 26, App Store requirement)
          - { platform: android, runner: ubuntu-22.04 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-15; toolchain set below
        with:
          toolchain: 1.99.1 # = rust-toolchain.toml
          targets: ${{ matrix.platform == 'ios' && 'aarch64-apple-ios' || 'aarch64-linux-android' }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: { key: "${{ matrix.platform }}" }
      - run: npm run build:app

      # ---- iPhone: the Rust library, whose build scripts compile the plugins' Swift packages
      - name: Use Xcode 26 (as release.yml)
        if: matrix.platform == 'ios'
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$X" ] || { echo "::error::no Xcode 26 on this runner"; exit 1; }
          sudo xcode-select -s "$X/Contents/Developer"; xcodebuild -version
      - name: Compile (iOS library and the plugins' Swift)
        if: matrix.platform == 'ios'
        env:
          IPHONEOS_DEPLOYMENT_TARGET: "26.0" # = tauri.conf.json bundle.iOS.minimumSystemVersion
        run: tools/ci-cargo.sh build -p humid --target aarch64-apple-ios --lib

      # ---- Android: the whole Gradle build, so the plugins' Kotlin compiles on every PR (it
      # never did before 5.0: CI built only the Rust library). Release variant, unsigned, one
      # ABI: the release type is the one with R8 minification, so a shrinker rule that strips a
      # plugin class fails here, and nothing debuggable is built. The APK is not uploaded.
      - name: Android · Java 17
        if: matrix.platform == 'android'
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with: { distribution: temurin, java-version: 17 }
      - name: Android · SDK platform 37, build-tools 37, NDK r30 (as release.yml)
        if: matrix.platform == 'android'
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKM" || { echo "::error::no Android SDK on this runner ($SDK)"; exit 1; }
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "ndk;30.0.16248370" "platforms;android-37" "build-tools;37.0.0" > /dev/null
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "NDK_HOME=$SDK/ndk/30.0.16248370" >> "$GITHUB_ENV"
      - name: Android · generate the Gradle project
        if: matrix.platform == 'android'
        run: npm run tauri -- android init --ci
      - name: Android · build (Rust, the plugins' Kotlin, Gradle; unsigned release APK, arm64)
        if: matrix.platform == 'android'
        run: |
          set -o pipefail
          npm run tauri -- android build --ci --apk --target aarch64 2>&1 | tee android-build.log && exit 0
          echo "::error title=Android build failed::$(grep -v '^w: ' android-build.log | grep -A14 -E 'What went wrong|^e: |error(\[E[0-9]+\])?:' | head -45 | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' | cut -c1-3800)"
          exit 1

  # The chip reader end to end through real native code: the shared ICAO 9303 reader drives
  # tauri-plugin-humid-nfc's PC/SC transport, through pcscd, to a simulated passport chip in a
  # virtual reader (vsmartcard vpcd). Then the server's own checks verify what was read.
  chip-reader:
    needs: test
    runs-on: ubuntu-24.04 # pcsc-lite 2 (--disable-polkit) and vsmartcard 0.9
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-15; toolchain set below
        with: { toolchain: 1.99.1 } # = rust-toolchain.toml
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: { key: chip-reader }
      - name: PC/SC daemon, virtual reader, Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev libpcsclite-dev pcscd vsmartcard-vpcd
      - name: Build the reader bridge (the plugin's real PC/SC code, without Tauri)
        run: tools/ci-cargo.sh build -p tauri-plugin-humid-nfc --example apdu-bridge --features pcsc-linux
      - name: Start pcscd with the virtual reader
        run: |
          sudo systemctl stop pcscd.socket pcscd.service 2>/dev/null || true
          sudo pcscd --foreground --disable-polkit > pcscd.log 2>&1 &
          for i in $(seq 1 30); do (echo > /dev/tcp/127.0.0.1/35963) 2>/dev/null && exit 0; sleep 0.5; done
          echo "::error::pcscd / vpcd didn't start: $(tail -20 pcscd.log | tr '\n' ' ')"; exit 1
      - name: Read a chip through the native transport
        run: |
          node --test tests/e2e/pcsc.test.js > pcsc-test.log 2>&1 && exit 0
          cat pcsc-test.log
          echo "::error::$(grep -E 'error:|Error|expected|actual' pcsc-test.log | head -12 | tr '\n' ' ') pcscd: $(tail -8 pcscd.log | tr '\n' ' ')"; exit 1
        env: { NODE_NO_WARNINGS: "1", HUMID_REQUIRE_PCSC: "1" }

  id-scan:
    name: id-scan (browser)
    needs: test
    runs-on: ubuntu-22.04
    timeout-minutes: 25 # the checks take ~8 min; a stuck browser fails fast instead of holding the run
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Chromium for the browser check
        # zizmor: ignore[adhoc-packages] exact version; a locked devDependency is audit 6-build M6
        run: npm i --no-save --no-audit --no-fund playwright@1.56.0 && npx playwright install --with-deps chromium
      - name: Scan an ID with a fake camera (barcode, live MRZ, simulated chip, seal, open)
        run: |
          node tests/browser/idscan.mjs > idscan.log 2>&1 && { grep -v '^{"t"' idscan.log; exit 0; }
          grep -v '^{"t"' idscan.log | tail -60
          echo "::error::$(grep -v '^{"t"' idscan.log | grep -E 'Error|expected|actual|assert|waiting for|idscan.mjs:' | head -8 | tr '\n' ' ')"; exit 1
        env: { NODE_NO_WARNINGS: "1", SHOTS: "idscan-shots" }
      - name: Getting set up (small phones, seal-card check, protection checklist, 44 px targets, pinned server)
        run: |
          node tests/browser/setup.mjs > setup.log 2>&1 && { grep -v '^{"t"' setup.log; exit 0; }
          grep -v '^{"t"' setup.log | tail -60
          echo "::error::$(grep -v '^{"t"' setup.log | grep -E 'Error|expected|actual|assert|off screen|under 44|waiting for|setup.mjs:' | head -8 | tr '\n' ' ')"; exit 1
        env: { NODE_NO_WARNINGS: "1", SHOTS: "idscan-shots/setup" }
      - name: Offline, read only (sealed copy, no network, server down, duress, reconnect)
        run: |
          node tests/browser/offline.mjs > offline.log 2>&1 && { grep -v '^{"t"' offline.log; exit 0; }
          grep -v '^{"t"' offline.log | tail -60
          echo "::error::$(grep -v '^{"t"' offline.log | grep -E 'Error|expected|actual|assert|readable|waiting for|offline.mjs:' | head -8 | tr '\n' ' ')"; exit 1
        env: { NODE_NO_WARNINGS: "1", SHOTS: "idscan-shots/offline" }
      - name: Take a photo (finds a tilted page anywhere in view, straightens and turns it, location stamp)
        run: |
          node tests/browser/photo.mjs > photo.log 2>&1 && { grep -v '^{"t"' photo.log; exit 0; }
          grep -v '^{"t"' photo.log | tail -60
          echo "::error::$(grep -v '^{"t"' photo.log | grep -E 'Error|expected|actual|assert|readable|waiting for|photo.mjs:' | head -8 | tr '\n' ' ')"; exit 1
        env: { NODE_NO_WARNINGS: "1", SHOTS: "idscan-shots/photo" }
      - name: The camera says what it is doing (Looking, Hold steady, Reading, Verifying, Done; the 10 s offer, the 30 s stop; worker)
        run: |
          node tests/browser/scanfeedback.mjs > scanfeedback.log 2>&1 && { grep -v '^{"t"' scanfeedback.log; exit 0; }
          grep -v '^{"t"' scanfeedback.log | tail -60
          echo "::error::$(grep -v '^{"t"' scanfeedback.log | grep -E 'Error|expected|actual|assert|waiting for|scanfeedback.mjs:' | head -8 | tr '\n' ' ')"; exit 1
        env: { NODE_NO_WARNINGS: "1", SHOTS: "idscan-shots/scanfeedback" }
      - name: Guided scan (fixed outline per document, plain-word guidance, auto and manual capture, crop to the outline, takePhoto stand-in; fake camera)
        run: |
          node tests/browser/guided.mjs > guided.log 2>&1 && { grep -v '^{"t"' guided.log; exit 0; }
          grep -v '^{"t"' guided.log | tail -60
          echo "::error::$(grep -v '^{"t"' guided.log | grep -E 'Error|expected|actual|assert|waiting for|guided.mjs:' | head -8 | tr '\n' ' ')"; exit 1
        env: { NODE_NO_WARNINGS: "1", SHOTS: "idscan-shots/guided" }
      - name: The phone's document scanner (Android; license and passport read from the scanned page, back out, scan again, no scanner falls back to the camera)
        run: |
          node tests/browser/docscan.mjs > docscan.log 2>&1 && { grep -v '^{"t"' docscan.log; exit 0; }
          grep -v '^{"t"' docscan.log | tail -60
          echo "::error::$(grep -v '^{"t"' docscan.log | grep -E 'Error|expected|actual|assert|waiting for|docscan.mjs:' | head -8 | tr '\n' ' ')"; exit 1
        env: { NODE_NO_WARNINGS: "1", SHOTS: "idscan-shots/docscan" }
      - name: Payment cards and Wallet passes (front and back read by the camera, masked, no copying; pass signatures)
        run: |
          node tests/browser/cards.mjs > cards.log 2>&1 && { grep -v '^{"t"' cards.log; exit 0; }
          grep -v '^{"t"' cards.log | tail -60
          echo "::error::$(grep -v '^{"t"' cards.log | grep -E 'Error|expected|actual|assert|waiting for|cards.mjs:' | head -8 | tr '\n' ' ')"; exit 1
        env: { NODE_NO_WARNINGS: "1", SHOTS: "idscan-shots/cards" }
      - name: Managing the server (admin console + app; enrol a phone, approve a change)
        run: |
          node tests/browser/admin.mjs > admin.log 2>&1 && { grep -v '^{"t"' admin.log; exit 0; }
          grep -v '^{"t"' admin.log | tail -60
          echo "::error::$(grep -v '^{"t"' admin.log | grep -E 'Error|expected|actual|assert|waiting for|admin.mjs:' | head -8 | tr '\n' ' ')"; exit 1
        env: { NODE_NO_WARNINGS: "1", SHOTS: "idscan-shots/admin" }
      - name: Check-in (turn on, check in, a longer night window, duress erases, decoy stays)
        run: |
          node tests/browser/checkin.mjs > checkin.log 2>&1 && { grep -v '^{"t"' checkin.log; exit 0; }
          grep -v '^{"t"' checkin.log | tail -60
          echo "::error::$(grep -v '^{"t"' checkin.log | grep -E 'Error|expected|actual|assert|waiting for|checkin.mjs:' | head -8 | tr '\n' ' ')"; exit 1
        env: { NODE_NO_WARNINGS: "1", SHOTS: "idscan-shots/checkin" }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with: { name: idscan-shots, path: idscan-shots, if-no-files-found: ignore, retention-days: 7 }

  images:
    needs: [changes, test]
    if: needs.changes.outputs.server == 'true'
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, identity, vault, ledger, recovery, access, keyshare, relay, edge]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build humid-${{ matrix.service }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ${{ matrix.service == 'edge' && 'services/edge/Dockerfile' || 'services/Dockerfile' }}
          build-args: SERVICE=${{ matrix.service }}
          tags: humid-${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          outputs: type=docker,dest=/tmp/humid-${{ matrix.service }}.tar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: "image-${{ matrix.service }}", path: "/tmp/humid-${{ matrix.service }}.tar", retention-days: 1 }

  stack:
    needs: [changes, test, images]
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { pattern: "image-*", path: /tmp/images, merge-multiple: true }
      - name: Load images built in this run; build the rest
        working-directory: deploy
        run: |
          for t in /tmp/images/*.tar; do docker load -i "$t"; done
          for s in gateway identity vault ledger recovery access keyshare relay edge; do
            if docker image inspect "humid-$s:ci" >/dev/null 2>&1; then docker tag "humid-$s:ci" "local/humid-$s:ci"; fi
          done
          node ../services/gateway/src/server.js keygen 2>/dev/null > .env || true
          echo "HUMID_DOMAIN=localhost" >> .env
          export HUMID_REGISTRY=local HUMID_VERSION=ci
          missing=$(for s in gateway identity vault ledger recovery access keyshare relay edge; do docker image inspect "local/humid-$s:ci" >/dev/null 2>&1 || echo $s; done)
          if [ -n "$missing" ]; then docker compose build --pull $missing; fi
      - name: Boot the stack (docker compose)
        working-directory: deploy
        env: { HUMID_REGISTRY: local, HUMID_VERSION: ci }
        run: |
          docker compose up -d
          for i in $(seq 1 40); do curl -skf https://localhost/healthz >/dev/null && break; sleep 3; done
          docker compose ps
      - name: Smoke test over TLS + HTP/1 (default policy refuses devices without hardware proof, and accounts without a pass)
        env: { NODE_TLS_REJECT_UNAUTHORIZED: "0", NODE_NO_WARNINGS: "1", HUMID_REGISTRY: local, HUMID_VERSION: ci } # Caddy's local CA in CI only
        run: |
          curl -sk https://localhost/ | grep -q '<div id="app">'
          node tests/smoke.mjs https://localhost
          # with an access code: the pass is spent, the unproven device refused, and the pass refunded
          code=$(cd deploy && docker compose run --rm --no-deps access server.mjs mint 1 ci | tail -1)
          node tests/smoke.mjs https://localhost "$code"
      - name: Smoke test, full flow (gateway switched to HUMID_DEVICE_POLICY=biometric)
        env: { NODE_TLS_REJECT_UNAUTHORIZED: "0", NODE_NO_WARNINGS: "1", HUMID_REGISTRY: local, HUMID_VERSION: ci }
        run: |
          (cd deploy && HUMID_DEVICE_POLICY=biometric docker compose up -d gateway)
          for i in $(seq 1 40); do curl -skf https://localhost/healthz >/dev/null && break; sleep 3; done
          code=$(cd deploy && docker compose run --rm --no-deps access server.mjs mint 1 ci | tail -1)
          node tests/smoke.mjs https://localhost "$code"
      - name: Logs on failure
        if: failure()
        working-directory: deploy
        env: { HUMID_REGISTRY: local, HUMID_VERSION: ci }
        run: docker compose logs --no-color | tail -200

  windows-server:
    needs: [changes, test]
    if: needs.changes.outputs.server == 'true'
    runs-on: windows-latest
    env:
      HUMID: C:\Program Files\HumID Server\humid.ps1
      NODE_NO_WARNINGS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Build HumID Server for Windows
        run: node deploy/windows/build.mjs --zip
      - name: Install from the zip (Windows PowerShell 5.1; fetches Node.js from nodejs.org, checksum verified)
        shell: cmd # zizmor: ignore[misfeature] Windows PowerShell 5.1 from cmd, as a person installs it; no expressions
        run: |
          powershell -NoProfile -Command "Expand-Archive -Path (Get-ChildItem deploy\windows\out\HumID-Server-Windows-*.zip).FullName -DestinationPath $env:RUNNER_TEMP\pkg"
          powershell -NoProfile -ExecutionPolicy Bypass -File "%RUNNER_TEMP%\pkg\HumID-Server\humid.ps1" install -Quiet
      - name: Runs as LOCAL SERVICE; data readable only by admins and the server
        shell: pwsh
        run: |
          $t = Get-ScheduledTask -TaskName 'HumID Server'
          $t.Principal.UserId
          if ($t.Principal.UserId -notmatch 'LOCAL ?SERVICE') { throw "task runs as $($t.Principal.UserId)" }
          icacls C:\ProgramData\HumID
          $acl = (Get-Acl C:\ProgramData\HumID).Access | ForEach-Object { $_.IdentityReference.Value }
          if ($acl -match 'Users|Everyone') { throw "data folder is readable by: $($acl -join ', ')" }
          powershell -NoProfile -ExecutionPolicy Bypass -File $env:HUMID status
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Smoke test, default policy (refuses devices without hardware proof)
        run: node tests/smoke.mjs http://127.0.0.1:8480
      - name: Smoke test, full flow (humid set HUMID_DEVICE_POLICY=biometric; humid mint pays for the account)
        shell: pwsh
        run: |
          $kid = (Get-Content C:\ProgramData\HumID\server.json | ConvertFrom-Json).kid
          powershell -NoProfile -ExecutionPolicy Bypass -File $env:HUMID set HUMID_DEVICE_POLICY=biometric
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $code = (powershell -NoProfile -ExecutionPolicy Bypass -File $env:HUMID mint 1 ci | Select-String 'HA-[0-9A-Z-]+' | Select-Object -Last 1).Matches.Value
          if (-not $code) { throw "humid mint printed no access code" }
          $out = node tests/smoke.mjs http://127.0.0.1:8480 $code
          $out
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if (-not ($out -match 'blind-signed pass')) { throw "the full flow didn't run with an access pass" }
          $after = (Get-Content C:\ProgramData\HumID\server.json | ConvertFrom-Json).kid
          if ($after -ne $kid) { throw "server identity changed on restart" }
      - name: Secrets are sealed (DPAPI); the server keeps no key that opens a backup
        shell: pwsh
        run: |
          $j = & "C:\Program Files\HumID Server\node\node.exe" --no-warnings "C:\Program Files\HumID Server\humid-server.mjs" seal-status --root C:\ProgramData\HumID
          $j
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $s = ($j | Where-Object { $_ -match '^\s*\{' } | Select-Object -Last 1) | ConvertFrom-Json
          if ($s.mode -ne 'dpapi') { throw "secrets aren't sealed with DPAPI (mode: $($s.mode))" }
          if (@($s.plain).Count) { throw "secrets still in plain files: $($s.plain -join ', ')" }
          if ($s.internalKey -ne 'sealed') { throw "the internal key in humid.env is $($s.internalKey)" }
          if (-not @($s.sealed).Count) { throw 'no sealed secrets reported' }
          if (Test-Path 'C:\ProgramData\HumID\backup-key') { throw 'a backup key folder is on the server (3.0 kept one there; since 3.1 its private key is kept off the computer)' }
          $out = powershell -NoProfile -ExecutionPolicy Bypass -File $env:HUMID status | Out-String
          if ($out -notmatch 'Secrets\s+sealed \(DPAPI\)') { throw "humid status doesn't show sealed secrets: $out" }
          $bk = powershell -NoProfile -ExecutionPolicy Bypass -File $env:HUMID backup-key | Out-String
          if ($bk -notmatch 'none yet') { throw "a fresh install already has a backup key: $bk" }
      - name: Encrypted backup (keyshare apart), restore with the key file, and update in place keep the server's identity
        shell: pwsh
        run: |
          # On failure: say which check and what humid printed last, as an annotation (readable without the log).
          $script:last = ''
          trap {
            $m = ($script:last -replace "`r?`n", ' | ')
            if ($m.Length -gt 1500) { $m = '...' + $m.Substring($m.Length - 1500) }
            Write-Host "::error title=Encrypted backup step::$($_.Exception.Message) (line $($_.InvocationInfo.ScriptLineNumber)). Last humid output: $m"
            exit 1
          }
          # (not H: in PowerShell that's the Get-History alias, and aliases beat functions)
          function Invoke-Humid { $o = & powershell -NoProfile -ExecutionPolicy Bypass -File $env:HUMID @args 2>&1 | Out-String; $code = $LASTEXITCODE; $script:last = $o; Write-Host $o; return $code }
          $kid = (Get-Content C:\ProgramData\HumID\server.json | ConvertFrom-Json).kid
          $usb = Join-Path $env:RUNNER_TEMP 'usb'
          New-Item -ItemType Directory -Force -Path $usb | Out-Null
          $b = "$env:RUNNER_TEMP\b.humidbak"; $k = "$usb\keyshare.humidbak"; $key = "$usb\humid-backup.key"
          if ((Invoke-Humid backup -Path "$env:RUNNER_TEMP\early.humidbak") -eq 0) { throw 'a backup ran without a backup key' }
          if (Test-Path "$env:RUNNER_TEMP\early.humidbak") { throw 'a plain backup was written' }
          if ((Invoke-Humid backup-key new -Path 'C:\ProgramData\HumID\data\k.key') -eq 0 -or (Test-Path 'C:\ProgramData\HumID\data\k.key')) { throw 'the backup key went inside the data folder' }
          if (Invoke-Humid backup-key new -Path $key) { throw 'backup-key new failed' }
          if (Select-String -LiteralPath 'C:\ProgramData\HumID\admin\admin.env' -Pattern '"seed"' -SimpleMatch -Quiet) { throw 'the private key is on the server' }
          if (Invoke-Humid backup -Path $b -KeysharePath $k) { throw 'backup failed' }
          if (-not (Test-Path $b) -or -not (Test-Path $k)) { throw 'backup files missing' }
          foreach ($f in $b, $k) { if (Select-String -LiteralPath $f -Pattern 'HUMID_INTERNAL_PK' -SimpleMatch -Quiet) { throw "$f holds the settings in the clear" } }
          # refused restores change nothing: the server keeps running, and no opened backup is left behind
          $wrong = "$usb\wrong.key"   # another backup key, made apart from this server
          node --input-type=module -e "import { newBackupKey } from './deploy/windows/admin/backups.mjs'; process.stdout.write(newBackupKey().file)" | Set-Content -LiteralPath $wrong -Encoding ascii
          if ((Invoke-Humid restore -Path $b -KeysharePath $k -Key $wrong -Quiet) -eq 0) { throw 'restored with another backup key' }
          if ((Invoke-Humid restore -Path $b -KeysharePath $k -Quiet) -eq 0) { throw 'restored without the backup key file' }
          if ((Invoke-Humid restore -Path $b -Key $key -Quiet) -eq 0) { throw 'restored without keyshare''s half' }
          if ((Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8480/healthz -TimeoutSec 5).StatusCode -ne 200) { throw 'the server stopped after a refused restore' }
          if (Get-ChildItem C:\ProgramData\HumID -Directory -Filter 'before-restore-*') { throw 'a refused restore moved the data' }
          if (Get-ChildItem C:\ProgramData\HumID\admin\work -Directory -Filter 'restore-*' -ErrorAction SilentlyContinue) { throw 'a refused restore left the opened backup behind' }
          # both files and the key file: the server comes back as itself, its secrets sealed under this machine's DPAPI
          if (Invoke-Humid restore -Path $b -KeysharePath $k -Key $key -Quiet) { throw 'restore failed' }
          if (-not (Test-Path 'C:\ProgramData\HumID\data\keyshare\share-key.bin')) { throw 'keyshare''s data not restored' }
          if (-not (Get-ChildItem C:\ProgramData\HumID -Directory -Filter 'before-restore-*')) { throw 'the restore kept no copy of the previous data' }
          if (Get-ChildItem C:\ProgramData\HumID\admin\work -Directory -Filter 'restore-*' -ErrorAction SilentlyContinue) { throw 'the restore left the opened backup behind' }
          if ((Get-Content C:\ProgramData\HumID\server.json | ConvertFrom-Json).kid -ne $kid) { throw 'server identity changed on restore' }
          if ((Invoke-RestMethod http://127.0.0.1:8480/htp/v1/keys -TimeoutSec 10).kid -ne $kid) { throw 'the restored server serves a different key' }
          $st = & "C:\Program Files\HumID Server\node\node.exe" --no-warnings "C:\Program Files\HumID Server\humid-server.mjs" seal-status --root C:\ProgramData\HumID | Where-Object { $_ -match '^\s*\{' } | Select-Object -Last 1 | ConvertFrom-Json
          if ($st.mode -ne 'dpapi' -or @($st.plain).Count -or $st.internalKey -ne 'sealed') { throw "after the restore, secrets aren't all sealed: $($st | ConvertTo-Json -Compress)" }
          $script:last = & powershell -NoProfile -ExecutionPolicy Bypass -File "$env:RUNNER_TEMP\pkg\HumID-Server\humid.ps1" install -Quiet 2>&1 | Out-String
          $code = $LASTEXITCODE; Write-Host $script:last
          if ($code) { throw "reinstall failed (exit $code)" }
          $after = (Get-Content C:\ProgramData\HumID\server.json | ConvertFrom-Json).kid
          if ($after -ne $kid) { throw "server identity changed" }
          $script:last = node tests/smoke.mjs http://127.0.0.1:8480 2>&1 | Out-String
          $code = $LASTEXITCODE; Write-Host $script:last
          if ($code) { throw "smoke test failed after restore (exit $code)" }
      - name: Check-in guard (with vaults armed, humid commands that stop the server wait for a typed ERASE)
        shell: pwsh
        run: |
          $ps = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          $status = 'C:\ProgramData\HumID\server-status.json'
          $empty = (New-TemporaryFile).FullName
          function Humid([string[]]$Arguments) {
            $o = "$env:RUNNER_TEMP\guard-out.txt"; $e = "$env:RUNNER_TEMP\guard-err.txt"
            $p = Start-Process -FilePath $ps -ArgumentList (@('-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', "`"$env:HUMID`"") + $Arguments) `
              -RedirectStandardInput $empty -RedirectStandardOutput $o -RedirectStandardError $e -NoNewWindow -PassThru
            $null = $p.Handle   # so ExitCode is kept
            if (-not $p.WaitForExit(180000)) { $p.Kill(); throw "humid $($Arguments -join ' ') hung (waiting for input?)" }
            $out = @((Get-Content -LiteralPath $o -Raw), (Get-Content -LiteralPath $e -Raw)) -join "`n"
            Write-Host $out
            return [pscustomobject]@{ Code = $p.ExitCode; Out = $out }
          }
          $r = Humid @('stop')
          if ($r.Code) { throw "stop failed with nothing armed (exit $($r.Code))" }
          # The server is stopped, so nothing rewrites its status file: pretend two vaults are armed.
          @{ at = (Get-Date).ToUniversalTime().ToString('o'); checkin = @{ armed = 2 } } | ConvertTo-Json | Set-Content -LiteralPath $status
          $r = Humid @('restart')
          if ($r.Code -eq 0) { throw 'restart went ahead with vaults armed and no ERASE typed' }
          if ($r.Out -notmatch '2 vaults are armed') { throw 'no armed-vault warning' }
          if ((Get-ScheduledTask -TaskName 'HumID Server').State -eq 'Running') { throw 'the server was started anyway' }
          $r = Humid @('set', 'HUMID_CHECKIN=on')
          if ($r.Code -eq 0) { throw 'set went ahead with vaults armed' }
          if (Select-String -LiteralPath 'C:\ProgramData\HumID\humid.env' -Pattern '^\s*HUMID_CHECKIN\s*=\s*on' -Quiet) { throw 'set changed the setting anyway' }
          $r = Humid @('restart', '-Quiet')
          if ($r.Code) { throw "restart -Quiet failed (exit $($r.Code))" }
          if ($r.Out -notmatch 'Going ahead') { throw 'no armed-vault warning with -Quiet' }
          # The running server writes its own count again (none armed).
          $deadline = (Get-Date).AddSeconds(60); $armed = 2
          while ((Get-Date) -lt $deadline -and $armed -ne 0) {
            try { $armed = (Get-Content -LiteralPath $status -Raw | ConvertFrom-Json).checkin.armed } catch {}
            if ($armed -ne 0) { Start-Sleep -Seconds 2 }
          }
          if ($armed -ne 0) { throw "the server didn't rewrite server-status.json (armed: $armed)" }
          node tests/smoke.mjs http://127.0.0.1:8480
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: A test instance runs beside the server
        shell: pwsh
        run: |
          $ps = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          $empty = (New-TemporaryFile).FullName
          function Humid([string]$Ps1, [string[]]$Arguments, [int]$Seconds = 300) {
            $o = "$env:RUNNER_TEMP\inst-out.txt"; $e = "$env:RUNNER_TEMP\inst-err.txt"
            $p = Start-Process -FilePath $ps -ArgumentList (@('-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', "`"$Ps1`"") + $Arguments) `
              -RedirectStandardInput $empty -RedirectStandardOutput $o -RedirectStandardError $e -NoNewWindow -PassThru
            $null = $p.Handle   # so ExitCode is kept
            if (-not $p.WaitForExit($Seconds * 1000)) { $p.Kill(); throw "humid $($Arguments -join ' ') hung (waiting for input?)" }
            $out = @((Get-Content -LiteralPath $o -Raw), (Get-Content -LiteralPath $e -Raw)) -join "`n"
            Write-Host $out
            return [pscustomobject]@{ Code = $p.ExitCode; Out = $out }
          }
          $kid = (Get-Content C:\ProgramData\HumID\server.json | ConvertFrom-Json).kid
          $test = 'C:\Program Files\HumID Server (test)\humid.ps1'
          $r = Humid "$env:RUNNER_TEMP\pkg\HumID-Server\humid.ps1" @('install', '-Instance', 'test', '-Port', '8580', '-DevicePolicy', 'biometric', '-Quiet') 900
          if ($r.Code) { throw "instance install failed (exit $($r.Code))" }
          foreach ($n in 'HumID Server (test)', 'HumID Admin (test)', 'HumID Admin Job (test)') { if (-not (Get-ScheduledTask -TaskName $n -ErrorAction SilentlyContinue)) { throw "task $n missing" } }
          if ((Get-Content 'C:\Program Files\HumID Server (test)\instance.txt' -Raw).Trim() -ne 'test') { throw 'instance.txt missing' }
          if (([Environment]::GetEnvironmentVariable('Path', 'Machine') -split ';') -contains 'C:\Program Files\HumID Server (test)') { throw 'the instance put itself on the PATH' }
          # its own humid.cmd needs no -Instance
          $st = & 'C:\Program Files\HumID Server (test)\humid.cmd' status | Out-String
          $st
          if ($st -notmatch 'Instance\s+test' -or $st -notmatch 'HumID-test') { throw 'the instance status shows the wrong install' }
          $r = Humid $test @('selftest')
          if ($r.Code) { throw "selftest failed (exit $($r.Code))" }
          if ($r.Out -notmatch 'blind-signed pass') { throw "the self-test didn't run the full flow with an access pass" }
          # the default install didn't notice
          if ((Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8480/healthz -TimeoutSec 5).StatusCode -ne 200) { throw 'the default server stopped answering' }
          if ((Get-Content C:\ProgramData\HumID\server.json | ConvertFrom-Json).kid -ne $kid) { throw 'the default server identity changed' }
          if ((Invoke-RestMethod http://127.0.0.1:8480/htp/v1/keys -TimeoutSec 10).kid -ne $kid) { throw 'the default server serves another key' }
          $r = Humid $env:HUMID @('uninstall', '-Instance', 'test', '-RemoveData', '-Quiet')
          if ($r.Code) { throw "instance uninstall failed (exit $($r.Code))" }
          foreach ($n in 'HumID Server (test)', 'HumID Admin (test)', 'HumID Admin Job (test)') { if (Get-ScheduledTask -TaskName $n -ErrorAction SilentlyContinue) { throw "task $n still registered" } }
          if (Test-Path 'C:\Program Files\HumID Server (test)') { throw 'instance program folder still there' }
          if (Test-Path 'C:\ProgramData\HumID-test') { throw 'instance data still there' }
          if (-not (Get-ScheduledTask -TaskName 'HumID Server' -ErrorAction SilentlyContinue)) { throw 'the default task is gone' }
          if (([Environment]::GetEnvironmentVariable('Path', 'Machine') -split ';') -notcontains 'C:\Program Files\HumID Server') { throw 'the default install left the PATH' }
          if ((Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8480/healthz -TimeoutSec 5).StatusCode -ne 200) { throw 'the default server stopped answering' }
      - name: Split roles on one machine (front+core here, keys in an instance, mutual TLS)
        shell: pwsh
        run: |
          $ps = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          $empty = (New-TemporaryFile).FullName
          function Humid([string]$Ps1, [string[]]$Arguments, [int]$Seconds = 300) {
            $o = "$env:RUNNER_TEMP\split-out.txt"; $e = "$env:RUNNER_TEMP\split-err.txt"
            $p = Start-Process -FilePath $ps -ArgumentList (@('-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', "`"$Ps1`"") + $Arguments) `
              -RedirectStandardInput $empty -RedirectStandardOutput $o -RedirectStandardError $e -NoNewWindow -PassThru
            $null = $p.Handle
            if (-not $p.WaitForExit($Seconds * 1000)) { $p.Kill(); throw "humid $($Arguments -join ' ') hung (waiting for input?)" }
            $out = @((Get-Content -LiteralPath $o -Raw), (Get-Content -LiteralPath $e -Raw)) -join "`n"
            Write-Host $out
            if ($p.ExitCode) { throw "humid $($Arguments -join ' ') failed (exit $($p.ExitCode))" }
            return $out
          }
          $kid = (Get-Content C:\ProgramData\HumID\server.json | ConvertFrom-Json).kid
          $keysPs = 'C:\Program Files\HumID Server (keys)\humid.ps1'
          $bundle = "$env:RUNNER_TEMP\keysbundle"
          $null = Humid "$env:RUNNER_TEMP\pkg\HumID-Server\humid.ps1" @('install', '-Instance', 'keys', '-Port', '8680', '-AdminPort', '8690', '-NoStart', '-Quiet') 900
          $null = Humid $env:HUMID @('pki', 'init')
          $null = Humid $env:HUMID @('pki', 'issue', 'keys', '-Path', $bundle)
          foreach ($f in 'ca.crt', 'keys.crt', 'keys.key', 'internal.pub') { if (-not (Test-Path (Join-Path $bundle $f))) { throw "the bundle has no $f" } }
          $null = Humid $keysPs @('pki', 'import', '-Path', $bundle)
          $null = Humid $keysPs @('set', 'HUMID_ROLES=keys', 'HUMID_INTERNAL_BIND=127.0.0.1', 'HUMID_INTERNAL_PORT_BASE=8600')
          if ((Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8680/healthz -TimeoutSec 5).StatusCode -ne 200) { throw 'the keys instance does not answer its health check' }
          $listen = @(Get-NetTCPConnection -LocalPort 8606 -State Listen -ErrorAction SilentlyContinue)
          if (-not $listen.Count -or ($listen.LocalAddress | Where-Object { $_ -ne '127.0.0.1' })) { throw "keyshare listens on: $($listen.LocalAddress -join ', ')" }
          $refused = $false
          try { Invoke-WebRequest -UseBasicParsing -SkipCertificateCheck https://127.0.0.1:8606/healthz -TimeoutSec 10 | Out-Null } catch { $refused = $true }
          if (-not $refused) { throw 'keyshare answered a client without a certificate' }
          $st = Humid $keysPs @('status')
          if ($st -notmatch 'Roles\s+keys' -or $st -notmatch 'keyshare on 127\.0\.0\.1:8606') { throw 'the keys instance status shows no internal address' }
          # the default install runs front and core, and reaches keys over mutual TLS
          $null = Humid $env:HUMID @('set', 'HUMID_DEVICE_POLICY=biometric', 'HUMID_ROLES=front,core', 'HUMID_KEYS_HOST=127.0.0.1', 'HUMID_INTERNAL_PORT_BASE=8600')
          $info = Get-Content C:\ProgramData\HumID\server.json | ConvertFrom-Json
          if (($info.roles -join ',') -ne 'front,core') { throw "the default install runs $($info.roles -join ',')" }
          if ($info.kid -ne $kid) { throw 'the server identity changed with the roles' }
          $code = [regex]::Match((Humid $env:HUMID @('mint', '1', 'ci')), 'HA-[0-9A-Z-]+').Value
          if (-not $code) { throw 'humid mint printed no access code' }
          $out = node tests/smoke.mjs http://127.0.0.1:8480 $code
          $out
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if (-not ($out -match 'blind-signed pass')) { throw "the full flow didn't run with an access pass" }
          # back to one machine, all roles; the keys instance goes
          $null = Humid $env:HUMID @('set', 'HUMID_ROLES=front,core,keys', 'HUMID_KEYS_HOST=', 'HUMID_INTERNAL_PORT_BASE=8500')
          $null = Humid $env:HUMID @('uninstall', '-Instance', 'keys', '-RemoveData', '-Quiet')
          foreach ($n in 'HumID Server (keys)', 'HumID Admin (keys)', 'HumID Admin Job (keys)') { if (Get-ScheduledTask -TaskName $n -ErrorAction SilentlyContinue) { throw "task $n still registered" } }
          if (Test-Path 'C:\ProgramData\HumID-keys') { throw 'keys instance data still there' }
          Remove-Item -LiteralPath $bundle -Recurse -Force
          $info = Get-Content C:\ProgramData\HumID\server.json | ConvertFrom-Json
          if (($info.roles -join ',') -ne 'front,core,keys') { throw "the default install runs $($info.roles -join ',')" }
          node tests/smoke.mjs http://127.0.0.1:8480
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Admin console (SYSTEM, 127.0.0.1 only), sign-in link, jobs, update with automatic rollback, rollback
        shell: pwsh
        run: ./tests/windows/admin-console.ps1 -Repo $env:GITHUB_WORKSPACE
      - name: Uninstall removes the tasks and, with -RemoveData, the data
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File $env:HUMID uninstall -RemoveData -Quiet
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          foreach ($n in 'HumID Server', 'HumID Admin', 'HumID Admin Job') { if (Get-ScheduledTask -TaskName $n -ErrorAction SilentlyContinue) { throw "task $n still registered" } }
          if (Test-Path 'C:\Program Files\HumID Server') { throw 'program folder still there' }
          if (Test-Path 'C:\ProgramData\HumID') { throw 'data still there' }
      - name: Log on failure
        if: failure()
        shell: pwsh
        run: |
          Get-ScheduledTaskInfo -TaskName 'HumID Server' -ErrorAction SilentlyContinue | Format-List
          Get-ScheduledTaskInfo -TaskName 'HumID Admin' -ErrorAction SilentlyContinue | Format-List
          Get-ScheduledTaskInfo -TaskName 'HumID Admin Job' -ErrorAction SilentlyContinue | Format-List
          Get-Content C:\ProgramData\HumID\logs\humid-server.log -Tail 150 -ErrorAction SilentlyContinue
          Get-Content C:\ProgramData\HumID\admin\logs\humid-admin.log -Tail 80 -ErrorAction SilentlyContinue
          foreach ($i in 'test', 'keys') { Get-Content "C:\ProgramData\HumID-$i\logs\humid-server.log" -Tail 60 -ErrorAction SilentlyContinue }
          Get-ChildItem C:\ProgramData\HumID\admin\jobs -Filter *.json -ErrorAction SilentlyContinue | ForEach-Object { $_.Name; Get-Content $_.FullName }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: HumID-Server-Windows
          path: deploy/windows/out/HumID-Server-Windows-*.zip
