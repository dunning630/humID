name: Publish server images

# On main: build the service images a change touches and publish them to
# GitHub's container registry (private to this repo's owner):
#   ghcr.io/dunning630/humid-{edge,gateway,identity,vault,ledger}:latest and :<commit>
# A server then updates with:  cd deploy && docker compose pull && docker compose up -d

on:
  push:
    branches: [main]
  workflow_dispatch: # publish all images

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.a.outputs.matrix }}
      any: ${{ steps.a.outputs.any }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - id: a
        env:
          EVENT: ${{ github.event_name }}
        run: |
          BASE=HEAD~1
          if [ "$EVENT" = "workflow_dispatch" ]; then BASE=none; fi
          OUT=$(node tools/affected.mjs "$BASE")
          echo "matrix=$(echo "$OUT" | jq -c .serviceMatrix)" >> "$GITHUB_OUTPUT"
          echo "any=$(echo "$OUT" | jq '.services | length > 0')" >> "$GITHUB_OUTPUT"

  publish:
    needs: plan
    if: needs.plan.outputs.any == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write # the only job that pushes to ghcr.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.service == 'edge' && 'services/edge/Dockerfile' || 'services/Dockerfile' }}
          build-args: SERVICE=${{ matrix.service }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/humid-${{ matrix.service }}:latest
            ghcr.io/${{ github.repository_owner }}/humid-${{ matrix.service }}:${{ github.sha }}
          # no build cache when publishing: a published image is built from scratch
          no-cache: true
