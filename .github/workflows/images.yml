name: Publish server images

# On main, when server code changed: build every service image and publish it to
# GitHub's container registry (private to this repo's owner):
#   ghcr.io/dunning630/humid-{edge,gateway,identity,vault,ledger,...}:latest and :<commit>
# A server then updates with:  cd deploy && docker compose pull && docker compose up -d
#
# 5.0: every image is rebuilt together (the per-file change map, tools/affected.mjs, is
# gone); the paths below are what any image is built from.

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "services/**"
      - "apps/mobile/**"
      - "plugins/*/Cargo.toml"
      - "package.json"
      - "package-lock.json"
      - ".dockerignore"
      - ".github/workflows/images.yml"
  workflow_dispatch: # publish all images

permissions:
  contents: read

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, identity, vault, ledger, recovery, access, keyshare, relay, edge]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write # the only job that pushes to ghcr.io
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ${{ matrix.service == 'edge' && 'services/edge/Dockerfile' || 'services/Dockerfile' }}
          build-args: SERVICE=${{ matrix.service }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/humid-${{ matrix.service }}:latest
            ghcr.io/${{ github.repository_owner }}/humid-${{ matrix.service }}:${{ github.sha }}
          # no build cache when publishing: a published image is built from scratch
          no-cache: true
