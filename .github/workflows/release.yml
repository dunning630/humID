name: Release apps

# Build installable HumID apps. Pick the platforms; each builds, signs (when
# secrets exist) and uploads on its own runner.
#
#   Actions > Release apps > Run workflow > platforms: "android"  (or "all", "ios,android", …)
#   Tag app-vX.Y.Z  → iPhone and Android, plus HumID Server for Linux, attached to a draft GitHub release.
#   Desktop apps are paused (2026-10-23): no run builds the Mac, Windows or Linux desktop apps
#   unless the repository variable HUMID_DESKTOP_RELEASES is on. "linux" now means HumID
#   Server for Linux (server-linux.yml); the Linux desktop app is "linux-desktop".
#   "all" means ios,android,linux.
#   Or tick "Publish apps" when you run it: a pre-release tagged app-v<apps/mobile version>
#   on the run's commit, with each installer and the whole bundle as one zip.
#   Every run also leaves one artifact, HumID-<version>-<server>: a "HumID <version>" folder
#   with a folder per app (Android, iPhone, Mac, Windows, Linux, Windows Server).
#
# HumID Server for Windows rides along: platforms "server-windows" builds the
# server zip on Windows, installs and smoke-tests it, and with "Publish" ticked
# creates its own release (tag server-win-v<version>). See server-windows.yml.
#
# Which vault server the apps talk to (repository variables, Settings > Secrets and variables > Actions > Variables,
# or the server_url / server_kid boxes when you run it by hand, which win over the variables):
#   HUMID_SERVER_URL   e.g. https://vault.humidsecure.ai
#   HUMID_SERVER_KID   the server's 64-hex key id (printed by deploy/setup.sh or `humid status`) — pins it in the app
#   HUMID_TLOG_COSIGNERS  optional, the same name=key,… as the server's: the public log's independent cosigners
#                      the apps trust (PC-04). Without it apps verify the log but show no cosigners.
#   HUMID_LEDGER_KEY_FP  the ledger's 32-hex signing-key fingerprint (printed by deploy/setup.sh) — built into the
#                      app, so a new install never trusts the first ledger key it's shown (PC-04, CRYPTO-01).
#                      Without it the app pins the first key it verifies, as before.
# A published build must pin its server: HUMID_SERVER_KID has to be set as a repository variable, and the
# server_kid box is refused when publishing.
#
# Only reviewed code is built and signed (PC-06): the run must be on main, or on an app-v* tag whose commit
# is already on main (the guard job), and the signing jobs run in the "release" environment, which holds the
# signing secrets behind required reviewers (RELEASING.md, "Release environment").
#
# Signing secrets (in the "release" environment; optional, without them you still get installable test builds where the platform allows):
#   macOS + iOS: APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
#                APPLE_TEAM_ID, APPLE_API_ISSUER, APPLE_API_KEY, APPLE_API_KEY_P8 (base64)
#   Android:     ANDROID_KEYSTORE (base64 .jks), ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS
#   Windows:     WINDOWS_CERTIFICATE (base64 .pfx), WINDOWS_CERTIFICATE_PASSWORD

on:
  push:
    tags: ["app-v*"]
  workflow_dispatch:
    inputs:
      platforms:
        description: "Comma-separated: ios,android,linux (the Linux server) — or all — and/or server-windows. (Desktop apps macos, windows, linux-desktop are paused: built only with HUMID_DESKTOP_RELEASES=on)"
        default: android
        required: true
      publish_server:
        description: "With server-windows or linux: publish each server as a draft release (tags server-win-v<version>, server-linux-v<version>)"
        type: boolean
        default: false
      publish_apps:
        description: "Publish the apps as a pre-release (tag app-v<apps/mobile version> on this commit)"
        type: boolean
        default: false
      server_url:
        description: "Vault server the apps talk to, e.g. https://pd-cc.tail1234.ts.net (blank = the HUMID_SERVER_URL variable)"
        required: false
        default: ""
      server_kid:
        description: "That server's 64-hex key id from `humid status` (blank = the HUMID_SERVER_KID variable)"
        required: false
        default: ""
      simulate:
        description: "Simulation build: the vault server runs inside the app (no server needed; real biometric checks). Built as a separate app, app.humid.vault.sim / \"HumID Sim\"; can't be published as a release"
        type: boolean
        default: false

permissions: {} # each job asks for only what it needs; only publish may write

jobs:
  plan:
    runs-on: ubuntu-22.04
    permissions: {}
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      anyApps: ${{ steps.m.outputs.anyApps }}
      server: ${{ steps.m.outputs.server }}
      linuxServer: ${{ steps.m.outputs.linuxServer }}
      server_url: ${{ steps.pin.outputs.url }}
      server_kid: ${{ steps.pin.outputs.kid }}
    steps:
      # A simulation build carries the vault server inside the app. It's a demo, never a
      # release: it must not be published, and it must not install over the real app.
      - name: Refuse to publish a simulation build
        if: inputs.simulate == true && inputs.publish_apps == true
        run: |
          echo "::error::A simulation build (the server inside the app) can't be published as a release. Untick one of the two."
          exit 1
      # Desktop apps are paused (2026-10-17): a desktop gate has no hardware proof a
      # server can check. Since 2026-10-23 none is built either: "all" leaves them out, and
      # naming macos, windows or linux-desktop is skipped with a warning. "linux" is HumID
      # Server for Linux. HUMID_DESKTOP_RELEASES=on builds and publishes the desktop apps again.
      - id: m
        env:
          PUBLISHING: ${{ (startsWith(github.ref, 'refs/tags/app-v') || inputs.publish_apps == true) && '1' || '' }}
          DESKTOP_RELEASES: ${{ vars.HUMID_DESKTOP_RELEASES }}
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          WANT="${PLATFORMS:-all}"
          if [ "$DESKTOP_RELEASES" = "on" ]; then WANT="${WANT/all/ios,android,macos,windows,linux-desktop,linux}"; else WANT="${WANT/all/ios,android,linux}"; fi
          python3 - "$WANT" <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os, sys
          runners = {"ios": "macos-26", "macos": "macos-26", "windows": "windows-latest", "linux-desktop": "ubuntu-22.04", "android": "ubuntu-22.04"}
          want = [p.strip() for p in sys.argv[1].split(",") if p.strip()]
          server = "server-windows" in want
          linux_server = "linux" in want
          apps = [p for p in want if p not in ("server-windows", "linux")]
          bad = [p for p in apps if p not in runners]
          if bad: sys.exit(f"Unknown platform(s): {bad}")
          paused = [p for p in apps if p in ("macos", "windows", "linux-desktop")]
          if paused and os.environ.get("DESKTOP_RELEASES") != "on":
              print(f"::warning::Desktop apps are paused and aren't built: left out {', '.join(paused)} (HUMID_DESKTOP_RELEASES=on builds them)", file=sys.stderr)
              apps = [p for p in apps if p not in paused]
          desktop = [p for p in apps if p in ("macos", "windows", "linux-desktop")]
          if desktop and os.environ.get("PUBLISHING") and os.environ.get("DESKTOP_RELEASES") != "on":
              print(f"::warning::Desktop apps are paused and won't be published: left out {', '.join(desktop)}", file=sys.stderr)
              apps = [p for p in apps if p not in desktop]
          print("matrix=" + json.dumps({"include": [{"platform": p, "runner": runners[p]} for p in apps]}))
          print("anyApps=" + json.dumps(bool(apps)))
          print("server=" + json.dumps(server))
          print("linuxServer=" + json.dumps(linux_server))
          EOF
      # The server the apps are pinned to. A published app must pin its server's key, and
      # only a repository variable may set it then: never the free-form server_kid box.
      - name: Server the apps will use
        id: pin
        env:
          PUBLISHING: ${{ (startsWith(github.ref, 'refs/tags/app-v') || inputs.publish_apps == true) && '1' || '' }}
          URL_INPUT: ${{ inputs.server_url }}
          URL_VAR: ${{ vars.HUMID_SERVER_URL }}
          KID_INPUT: ${{ inputs.server_kid }}
          KID_VAR: ${{ vars.HUMID_SERVER_KID }}
        shell: bash
        run: |
          URL="${URL_INPUT:-$URL_VAR}"
          if [ -n "$PUBLISHING" ]; then
            if [ -n "$KID_INPUT" ]; then echo "::error::A published build takes its server key id only from the HUMID_SERVER_KID repository variable, not the server_kid box. Clear the box (and set the variable if it isn't)."; exit 1; fi
            KID="$KID_VAR"
            if ! [[ "$KID" =~ ^[0-9a-fA-F]{64}$ ]]; then echo "::error::Publishing needs the HUMID_SERVER_KID repository variable set to the server's 64-hex key id (deploy/setup.sh or humid status prints it), so every published app pins its server."; exit 1; fi
            if [ -z "$URL" ]; then echo "::error::Publishing needs the server's URL: set the HUMID_SERVER_URL repository variable."; exit 1; fi
          else
            KID="${KID_INPUT:-$KID_VAR}"
          fi
          if [ -n "$URL" ] && ! [[ "$URL" =~ ^https://[A-Za-z0-9.-]+(:[0-9]+)?$ ]]; then echo "::error::server URL must be https://host with no path"; exit 1; fi
          if [ -n "$KID" ] && ! [[ "$KID" =~ ^[0-9a-fA-F]{64}$ ]]; then echo "::error::server key id must be 64 hex characters"; exit 1; fi
          if [ -z "$URL" ]; then
            echo "::warning::HUMID_SERVER_URL is not set; the app will need a server URL. Set it under Settings > Secrets and variables > Actions > Variables."
          else
            echo "Building for $URL (pinned key: ${KID:-trust on first use})"
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "kid=$(echo "$KID" | tr 'A-F' 'a-f')" >> "$GITHUB_OUTPUT"

  # Signing secrets and publishing only for reviewed code: a run on main, or on an app-v* tag
  # whose commit is already on main. Every other job needs this one. (The release
  # environment's deployment-branch policy enforces the same on GitHub's side.)
  guard:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0, persist-credentials: false } # all of main's history, for the ancestry check
      - name: Only main, or an app-v* tag on a commit already on main
        env:
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          case "$REF" in
            refs/heads/main | refs/tags/app-v*) ;;
            *) echo "::error::Release apps runs only on main or an app-v* tag, not $REF. Merge the change to main first (CI compiles every branch)."; exit 1 ;;
          esac
          git rev-parse --verify --quiet refs/remotes/origin/main > /dev/null || { echo "::error::couldn't read origin/main"; exit 1; }
          if ! git merge-base --is-ancestor "$SHA" refs/remotes/origin/main; then
            echo "::error::$SHA is not on main: releases are built only from code merged to main."
            exit 1
          fi
          echo "$REF at $SHA is on main."

  server-windows:
    needs: [plan, guard]
    if: needs.plan.outputs.server == 'true'
    uses: ./.github/workflows/server-windows.yml # zizmor: ignore[self-repository]
    with:
      publish: ${{ inputs.publish_server == true }}
    permissions:
      contents: write

  server-linux:
    needs: [plan, guard]
    if: needs.plan.outputs.linuxServer == 'true'
    uses: ./.github/workflows/server-linux.yml # zizmor: ignore[self-repository]
    with:
      publish: ${{ inputs.publish_server == true }}
    permissions:
      contents: write

  build:
    needs: [plan, guard]
    if: needs.plan.outputs.anyApps == 'true'
    # The signing secrets live in this environment: required reviewers approve each run, and
    # only main and app-v* tags may use it (RELEASING.md, "Release environment").
    environment: release
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    env:
      HAS_APPLE: ${{ secrets.APPLE_CERTIFICATE != '' }}
      HAS_ANDROID_KEY: ${{ secrets.ANDROID_KEYSTORE != '' }}
      HAS_WIN_CERT: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
      HUMID_SERVER_URL: ${{ needs.plan.outputs.server_url }}
      HUMID_SERVER_KID: ${{ needs.plan.outputs.server_kid }}
      HUMID_TLOG_COSIGNERS: ${{ vars.HUMID_TLOG_COSIGNERS }}
      HUMID_LEDGER_KEY_FP: ${{ vars.HUMID_LEDGER_KEY_FP }}
      HUMID_SIMULATE: ${{ inputs.simulate == true && '1' || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      # No caches in a signing job: nothing a CI run left behind flows into a signed build.
      # setup-node v4 has no automatic cache, and none is configured (zizmor assumes v5's default)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0  # zizmor: ignore[cache-poisoning]
        with: { node-version: 24 }
      - run: npm ci --ignore-scripts # no dependency install scripts in the job that holds the signing keys
      - run: npm test
        env: { NODE_NO_WARNINGS: "1" }
      # The simulation app is its own app: a different bundle identifier and name, so it
      # installs beside the real HumID, never over it, and servers (which pin the
      # identifier through attestation) never mistake it for the real one.
      - name: Simulation build · separate app identity
        if: env.HUMID_SIMULATE == '1'
        shell: bash
        run: |
          node -e '
            const fs = require("fs"); const p = "apps/mobile/src-tauri/tauri.conf.json";
            const c = JSON.parse(fs.readFileSync(p, "utf8"));
            c.identifier = "app.humid.vault.sim"; c.productName = "HumID Sim"; c.app.windows[0].title = "HumID Sim";
            fs.writeFileSync(p, JSON.stringify(c, null, 2) + "\n");
          '
          echo "::warning::Simulation build: app.humid.vault.sim / HumID Sim (the vault server runs inside the app). Not a release."
      - name: Server the app will use
        shell: bash
        run: |
          if [ -z "$HUMID_SERVER_URL" ]; then
            echo "::warning::HUMID_SERVER_URL is not set; the app will need a server URL. Set it under Settings > Secrets and variables > Actions > Variables."
          else
            if ! [[ "$HUMID_SERVER_URL" =~ ^https://[A-Za-z0-9.-]+(:[0-9]+)?$ ]]; then echo "::error::server URL must be https://host with no path, got: $HUMID_SERVER_URL"; exit 1; fi
            if [ -n "$HUMID_SERVER_KID" ] && ! [[ "$HUMID_SERVER_KID" =~ ^[0-9a-fA-F]{64}$ ]]; then echo "::error::server key id must be 64 hex characters"; exit 1; fi
            # 3.0: a published app is always pinned to its server's key. Trust-on-first-use would hand
            # first contact to whoever controls the network at enrolment, for good (SEC-A-06).
            if [ -z "$HUMID_SERVER_KID" ] && [ "${HUMID_SIMULATE:-0}" != "1" ]; then echo "::error::HUMID_SERVER_KID is not set: a release build must pin its server's key. Set it under Settings > Secrets and variables > Actions > Variables (the key id is on the server's setup page)."; exit 1; fi
            if [ -n "$HUMID_LEDGER_KEY_FP" ] && ! [[ "$HUMID_LEDGER_KEY_FP" =~ ^[0-9a-fA-F]{32}$ ]]; then echo "::error::HUMID_LEDGER_KEY_FP must be 32 hex characters"; exit 1; fi
            if [ -z "$HUMID_LEDGER_KEY_FP" ]; then echo "::warning::HUMID_LEDGER_KEY_FP is not set: each new install will trust the first ledger key it sees. Set it from deploy/setup.sh's output."; fi
            echo "Building for $HUMID_SERVER_URL (pinned key: $HUMID_SERVER_KID)"
          fi

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-15; toolchain set below
        with:
          toolchain: 1.99.1 # = rust-toolchain.toml
          targets: >-
            ${{ matrix.platform == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin'
             || matrix.platform == 'ios' && 'aarch64-apple-ios,aarch64-apple-ios-sim'
             || matrix.platform == 'android' && 'aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android'
             || '' }}
      # No rust-cache here (see setup-node above). Cargo builds exactly what Cargo.lock names.
      - name: Cargo.lock is complete (cargo --locked; one workspace lockfile at the root)
        run: cargo fetch --locked

      # ---------------- Linux ----------------
      - name: Linux · system libraries
        if: matrix.platform == 'linux-desktop'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libdbus-1-dev rpm
      - name: Linux · build .deb .rpm .AppImage
        if: matrix.platform == 'linux-desktop'
        run: npm run tauri -- build

      # ---------------- Windows ----------------
      - name: Windows · import signing certificate
        if: matrix.platform == 'windows' && env.HAS_WIN_CERT == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfx = "$env:RUNNER_TEMP\sign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $pw = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pw
          $conf = Get-Content apps/mobile/src-tauri/tauri.conf.json | ConvertFrom-Json
          $conf.bundle.windows | Add-Member certificateThumbprint $cert.Thumbprint -Force
          $conf.bundle.windows | Add-Member digestAlgorithm "sha256" -Force
          $conf.bundle.windows | Add-Member timestampUrl "http://timestamp.digicert.com" -Force
          $conf | ConvertTo-Json -Depth 20 | Set-Content apps/mobile/src-tauri/tauri.conf.json
      - name: Windows · build .msi and setup .exe
        if: matrix.platform == 'windows'
        run: npm run tauri -- build

      # ---------------- macOS & iOS ----------------
      - name: Apple · keychain entitlement team id
        if: (matrix.platform == 'macos' || matrix.platform == 'ios') && env.HAS_APPLE == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          [[ "$APPLE_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]] || { echo "::error::APPLE_TEAM_ID must be the 10-character Team ID"; exit 1; }
          sed -i '' "s/TEAMID/$APPLE_TEAM_ID/" apps/mobile/src-tauri/Entitlements.plist
      - name: Apple · API key file
        if: (matrix.platform == 'macos' || matrix.platform == 'ios') && env.HAS_APPLE == 'true'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          [[ "$APPLE_API_KEY" =~ ^[A-Za-z0-9]+$ ]] || { echo "::error::APPLE_API_KEY must be the API key's id (letters and digits)"; exit 1; }
          umask 077
          mkdir -p ~/private_keys
          printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$HOME/private_keys/AuthKey_$APPLE_API_KEY.p8"
          echo "APPLE_API_KEY_PATH=$HOME/private_keys/AuthKey_$APPLE_API_KEY.p8" >> "$GITHUB_ENV"
      - name: macOS · universal signed + notarised .dmg
        if: matrix.platform == 'macos' && env.HAS_APPLE == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: npm run tauri -- build --target universal-apple-darwin
      - name: macOS · unsigned build (Touch ID needs a signed build)
        if: matrix.platform == 'macos' && env.HAS_APPLE != 'true'
        run: npm run tauri -- build --target aarch64-apple-darwin --bundles app --no-sign
      # Since 28 Apr 2026 App Store Connect refuses uploads not built with Xcode 26 / the iOS 26 SDK.
      - name: Apple · use Xcode 26
        if: matrix.platform == 'ios' || matrix.platform == 'macos'
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$X" ] || { echo "::error::no Xcode 26 on this runner; App Store Connect would refuse the upload"; exit 1; }
          sudo xcode-select -s "$X/Contents/Developer"; xcodebuild -version
      - name: iOS · generate Xcode project
        if: matrix.platform == 'ios'
        run: npm run tauri -- ios init --ci
      - name: iOS · App Attest entitlement (servers verify each phone's liveness key with it)
        if: matrix.platform == 'ios'
        run: |
          ENT=$(find apps/mobile/src-tauri/gen/apple -name '*.entitlements' -not -path '*/build/*' | head -1)
          if [ -z "$ENT" ]; then echo "::error::no iOS .entitlements file after ios init"; exit 1; fi
          /usr/libexec/PlistBuddy -c "Delete :com.apple.developer.devicecheck.appattest-environment" "$ENT" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :com.apple.developer.devicecheck.appattest-environment string production" "$ENT"
          echo "App Attest (production) added to $ENT"
          # Reading passport / ID chips (the App ID needs the NFC Tag Reading capability).
          /usr/libexec/PlistBuddy -c "Delete :com.apple.developer.nfc.readersession.formats" "$ENT" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :com.apple.developer.nfc.readersession.formats array" "$ENT"
          /usr/libexec/PlistBuddy -c "Add :com.apple.developer.nfc.readersession.formats:0 string TAG" "$ENT"
          echo "NFC tag reading added to $ENT"
      - name: iOS · signed .ipa for TestFlight / App Store Connect
        if: matrix.platform == 'ios' && env.HAS_APPLE == 'true'
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: npm run tauri -- ios build --export-method app-store-connect
      # Off unless the repository variable HUMID_TESTFLIGHT is "on" and this is a publishing run:
      # the signed .ipa goes to App Store Connect, where it appears in TestFlight once Apple has
      # processed it. Needs the app record (bundle id app.humid.vault) created in App Store Connect
      # first, and the API key (APPLE_API_KEY / APPLE_API_ISSUER) to have App Manager access.
      - name: iOS · upload to TestFlight (App Store Connect)
        if: matrix.platform == 'ios' && env.HAS_APPLE == 'true' && vars.HUMID_TESTFLIGHT == 'on' && (startsWith(github.ref, 'refs/tags/app-v') || inputs.publish_apps == true) && env.HUMID_SIMULATE != '1'
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          IPA=$(find apps/mobile/src-tauri/gen/apple/build -name '*.ipa' | head -1)
          [ -n "$IPA" ] || { echo "::error::no .ipa to upload"; exit 1; }
          # altool looks for AuthKey_<id>.p8 in ~/private_keys, where the API key step put it.
          xcrun altool --upload-app --type ios --file "$IPA" --apiKey "$APPLE_API_KEY" --apiIssuer "$APPLE_API_ISSUER"
          echo "::notice title=TestFlight::Uploaded $(basename "$IPA"); it shows in TestFlight after Apple processes it."
      # `tauri ios build` runs beforeBuildCommand; the bare cargo check below doesn't, and
      # generate_context!() refuses a missing frontendDist. Build the web app it embeds first.
      - name: iOS · build the web app (what the compile check embeds)
        if: matrix.platform == 'ios' && env.HAS_APPLE != 'true'
        working-directory: apps/mobile
        run: npm run build
      - name: iOS · compile check (no Apple signing yet)
        if: matrix.platform == 'ios' && env.HAS_APPLE != 'true'
        working-directory: apps/mobile/src-tauri
        # A failure names the compiler errors in an annotation (readable through the API without the log).
        run: |
          set -o pipefail
          cargo build --locked --release --target aarch64-apple-ios --lib 2>&1 | tee ios-build.log && exit 0
          echo "::error title=iOS compile failed::$( { grep -E -A6 '^error|panicked|failed to run custom build|^Caused by|error: linking|ld: |xcrun|swift' ios-build.log | head -60; echo '--- tail ---'; tail -25 ios-build.log; } | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' | cut -c1-3900)"
          exit 1

      # ---------------- Android ----------------
      # The runner's disk is too small for the NDK plus four Android Rust targets: free the
      # toolchains Android doesn't use (about 25 GB) before building.
      - name: Android · free disk space
        if: matrix.platform == 'android'
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /usr/local/share/powershell \
            /usr/local/lib/node_modules /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/go /opt/hostedtoolcache/PyPy /usr/share/swift || true
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -h / | tail -1
      - name: Android · Java 17
        if: matrix.platform == 'android'
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with: { distribution: temurin, java-version: 17 }
      - name: Android · SDK (preinstalled on GitHub's Ubuntu runners) and NDK
        if: matrix.platform == 'android'
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKM" || { echo "::error::no Android SDK on this runner ($SDK)"; exit 1; }
          yes | "$SDKM" --licenses > /dev/null || true
          # minSdk 37 (Android 17): Tauri links with <triple>37-clang, which needs an NDK whose
          # sysroot goes to API 37 (r30, "Upgraded the max API to 37"); compileSdk is 37 too.
          "$SDKM" --install "ndk;30.0.16248370" "platforms;android-37" "build-tools;37.0.0" > /dev/null
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "NDK_HOME=$SDK/ndk/30.0.16248370" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
      - name: Android · generate Gradle project
        if: matrix.platform == 'android'
        run: npm run tauri -- android init --ci
      # `android init` writes Tauri's own launcher icons (the blue-and-orange logo). Put HumID's
      # in their place: every density, the adaptive icon's layers and its background colour.
      - name: Android · HumID launcher icons
        if: matrix.platform == 'android'
        run: |
          set -euo pipefail
          SRC=apps/mobile/src-tauri/icons/android
          RES=apps/mobile/src-tauri/gen/android/app/src/main/res
          test -d "$RES" || { echo "::error::no Android res folder after android init ($RES)"; exit 1; }
          find "$RES" -path '*/mipmap-*' -name 'ic_launcher*' -delete
          cp -R "$SRC"/. "$RES"/
          for f in "$SRC"/mipmap-*/ic_launcher*.png; do cmp -s "$f" "$RES/${f#"$SRC"/}" || { echo "::error::$f didn't land in the Android project"; exit 1; }; done
          echo "HumID launcher icons in place: $(find "$RES" -path '*/mipmap-*' -name 'ic_launcher*' | wc -l) files"
      - name: Android · release signing config
        if: matrix.platform == 'android' && env.HAS_ANDROID_KEY == 'true'
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          umask 077
          APP=apps/mobile/src-tauri/gen/android/app
          case "$ANDROID_KEYSTORE_PASSWORD$ANDROID_KEY_ALIAS" in *$'\n'* | *$'\r'*) echo "::error::ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS must be one line each"; exit 1 ;; esac
          printf '%s' "$ANDROID_KEYSTORE" | base64 --decode > "$APP/release.jks"
          printf '%s\n' "storeFile=release.jks" "storePassword=$ANDROID_KEYSTORE_PASSWORD" "keyAlias=$ANDROID_KEY_ALIAS" "keyPassword=$ANDROID_KEYSTORE_PASSWORD" \
            > apps/mobile/src-tauri/gen/android/keystore.properties
          python3 tools/android-signing.py "$APP/build.gradle.kts"
      - name: Android · signed release .apk + .aab
        if: matrix.platform == 'android' && env.HAS_ANDROID_KEY == 'true'
        shell: bash
        run: |
          set -o pipefail
          if ! npm run tauri -- android build --apk --aab 2>&1 | tee android-build.log; then
            # the run's logs aren't always reachable: put what went wrong in the annotations too
            # the reason, not the deprecation warnings: Gradle's "What went wrong" and the lines after it
            echo "::error::$(grep -v '^w: ' android-build.log | grep -A14 -E 'What went wrong|^e: |error:' | head -45 | tr '\n' ' ' | cut -c1-3500)"
            exit 1
          fi
      # No debug builds, ever: a debug APK is debuggable (adb run-as reads the app's data),
      # has WebView remote debugging on, allows cleartext HTTP, and logs to logcat. Without
      # the release key there is no Android build.
      - name: Android · the release signing key is required
        if: matrix.platform == 'android' && env.HAS_ANDROID_KEY != 'true'
        run: |
          echo "::error::Android builds need the release signing key: add the ANDROID_KEYSTORE, ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS secrets (RELEASING.md). HumID never ships a debug build."
          exit 1
      # Every APK and AAB that will be published (exactly the files listed in
      # android-release-files.txt, which "Collect artifacts" copies) must be a release build
      # signed only with the HumID release certificate, never with a revoked key.
      - name: Android · prove every APK and AAB is a release build signed with our key
        if: matrix.platform == 'android' && env.HAS_ANDROID_KEY == 'true'
        shell: bash
        run: |
          set -euo pipefail
          BT=$(ls -d "${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"/build-tools/* | sort -V | tail -1)
          # Servers accept the certificate built into @humid/attest and refuse the revoked ones
          # (the leaked test key, docs/INCIDENT-2026-10-android-test-key.md); a build signed with
          # any other key would be refused by every server, so it must not ship.
          WANT=$(node --input-type=module -e 'import { HUMID_ANDROID_RELEASE_CERT as c } from "./packages/attest/src/roots.js"; console.log(c)')
          REVOKED=$(node --input-type=module -e 'import { REVOKED_ANDROID_CERTS as r } from "./packages/attest/src/roots.js"; console.log(r.join("\n"))')
          [[ "$WANT" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::no release certificate in packages/attest/src/roots.js"; exit 1; }
          # Gradle's final outputs only: never its intermediates (intermediary-bundle.aab)
          find apps/mobile/src-tauri/gen/android -type f -path '*/build/outputs/*' -path '*release*' \( -name '*.apk' -o -name '*.aab' \) | sort > android-release-files.txt
          cat android-release-files.txt
          grep -q '\.apk$' android-release-files.txt || { echo "::error::no release APK was built"; exit 1; }
          grep -q '\.aab$' android-release-files.txt || { echo "::error::no release AAB was built"; exit 1; }
          only_ours() { # <file> <its signing certificates' SHA-256, one per line>
            [ -n "$2" ] || { echo "::error::$1 is not signed"; exit 1; }
            while read -r d; do
              if grep -qxF "$d" <<< "$REVOKED"; then echo "::error::$1 is signed with a revoked key ($d, the leaked test key): it must never ship"; exit 1; fi
              [ "$d" = "$WANT" ] || { echo "::error::$1 is signed with $d, not the certificate servers accept ($WANT, packages/attest/src/roots.js)"; exit 1; }
            done <<< "$2"
            echo "$1: signed with $WANT only"
          }
          while read -r f; do
            case "$f" in
              *.apk)
                "$BT/apksigner" verify --print-certs "$f" | tee signer.txt
                grep -q "CN=HumID" signer.txt || { echo "::error::$f isn't signed with the HumID release key"; exit 1; }
                if "$BT/aapt" dump badging "$f" | grep -q "application-debuggable"; then echo "::error::$f is debuggable"; exit 1; fi
                only_ours "$f" "$(grep -iE 'certificate SHA-256 digest' signer.txt | awk '{print $NF}' | tr 'A-F' 'a-f' | sort -u)"
                ;;
              *.aab)
                jarsigner -verify "$f" | tee jarsigner.txt
                grep -q '^jar verified' jarsigner.txt || { echo "::error::$f: its signature doesn't verify"; exit 1; }
                keytool -printcert -jarfile "$f" | tee signer.txt
                only_ours "$f" "$(grep -E '^[[:space:]]*SHA256:' signer.txt | awk '{print $2}' | tr -d ':' | tr 'A-F' 'a-f' | sort -u)"
                ;;
            esac
          done < android-release-files.txt

      # The decoded keys never outlive the job, even when a step failed.
      - name: Remove decoded signing keys
        if: always() && matrix.platform != 'windows'
        shell: bash
        run: rm -rf apps/mobile/src-tauri/gen/android/app/release.jks apps/mobile/src-tauri/gen/android/keystore.properties "$HOME/private_keys"
      - name: Remove decoded signing keys (Windows)
        if: always() && matrix.platform == 'windows'
        shell: pwsh
        run: Remove-Item -LiteralPath "$env:RUNNER_TEMP\sign.pfx" -Force -ErrorAction SilentlyContinue
      - name: Cargo.lock unchanged by the build
        run: git diff --exit-code -- Cargo.lock

      # ---------------- collect ----------------
      - name: Collect artifacts
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p out
          find target apps/mobile/src-tauri/gen -type f \
            \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.msi' -o -name '*-setup.exe' \
               -o -name '*.dmg' -o -name '*.ipa' \) \
            -not -path '*/deps/*' -exec cp {} out/ \; 2>/dev/null || true
          # Android: only the release APK and AAB the signer check verified (no intermediary-bundle.aab)
          if [ "$PLATFORM" = "android" ]; then
            [ -s android-release-files.txt ] || { echo "::error::no verified Android builds"; exit 1; }
            while read -r f; do cp "$f" out/; done < android-release-files.txt
          fi
          if [ -z "$(ls -A out)" ] && [ "$PLATFORM" = "macos" ]; then
            ( cd target && find . -maxdepth 6 \( -name 'HumID.app' -o -name 'HumID Sim.app' \) -type d | head -1 | xargs -I{} zip -qry "$GITHUB_WORKSPACE/out/HumID-macos-unsigned.zip" {} ) || true
          fi
          ls -la out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: humid-${{ matrix.platform }}
          path: out/*
          if-no-files-found: warn

  # Everything this run built, as one folder per version with a folder per app
  # (Android/, iPhone/, Mac/, Windows/, Linux/, Windows Server/), a README naming
  # the server the apps are pinned to, and checksums. Download it from the run's
  # Artifacts: HumID-<version>-<server>.
  bundle:
    needs: [plan, guard, build, server-windows, server-linux]
    # bundle whatever built, even if one platform failed (but never past the guard)
    if: always() && needs.plan.result == 'success' && needs.guard.result == 'success'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      name: ${{ steps.bundle.outputs.name }}
    env:
      HUMID_SERVER_URL: ${{ needs.plan.outputs.server_url }}
      HUMID_SERVER_KID: ${{ needs.plan.outputs.server_kid }}
      HUMID_TLOG_COSIGNERS: ${{ vars.HUMID_TLOG_COSIGNERS }}
      HUMID_LEDGER_KEY_FP: ${{ vars.HUMID_LEDGER_KEY_FP }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { path: artifacts }
      - name: One folder per app
        id: bundle
        # A run that only compile-checks the iPhone app (no Apple signing) makes no
        # installer: that's a notice, not a failure, unless the run was meant to publish.
        env:
          PUBLISH_APPS: ${{ inputs.publish_apps }}
          REF: ${{ github.ref }}
        run: |
          set +e
          node tools/bundle-release.mjs artifacts bundle 2> bundle.err; code=$?
          cat bundle.err >&2
          if [ $code -eq 0 ]; then exit 0; fi
          if grep -q "No app builds found" bundle.err && [ "$PUBLISH_APPS" != "true" ] && [[ "$REF" != refs/tags/app-v* ]]; then
            echo "::notice title=Nothing to bundle::No installable app was built (an unsigned iPhone compile check makes none)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit $code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.bundle.outputs.skip != 'true'
        with:
          name: ${{ steps.bundle.outputs.name }}
          path: bundle/

  publish:
    needs: [plan, guard, build, bundle]
    # A tag push: a draft with every platform. "Publish apps": only if every platform built.
    if: always() && needs.guard.result == 'success' && needs.bundle.result == 'success' && (startsWith(github.ref, 'refs/tags/app-v') || (inputs.publish_apps == true && needs.build.result == 'success'))
    runs-on: ubuntu-22.04
    environment: release
    permissions:
      contents: write # the only job that may create a tag or a release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - id: v
        run: echo "version=$(node -p "require('./apps/mobile/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { pattern: "humid-*", path: dist, merge-multiple: true }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { name: "${{ needs.bundle.outputs.name }}", path: "bundle" }
      - name: The whole bundle as one zip
        env:
          BUNDLE_NAME: ${{ needs.bundle.outputs.name }}
        run: |
          [[ "$BUNDLE_NAME" =~ ^[A-Za-z0-9.-]+$ ]] || { echo "::error::unexpected bundle name"; exit 1; }
          (cd bundle && zip -qr "../dist/$BUNDLE_NAME.zip" .)
          ls -la dist
      - name: Release notes
        env:
          BUNDLE_NAME: ${{ needs.bundle.outputs.name }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          v="$VERSION"
          notes=$(awk -v v="## $v" '$0==v{f=1;next} /^## /{f=0} f' apps/mobile/CHANGELOG.md)
          cat > notes.md <<EOF
          HumID apps $v, pinned to the server named in the bundle's README.

          **Download:** \`$BUNDLE_NAME.zip\` has every app in its own folder, or take one installer below.
          **Android:** open the \`.apk\` on the phone and allow installing from that app. **Windows:** run the \`-setup.exe\`.
          **Linux Server:** \`HumID-Server-Linux-*.tar.gz\`, the vault server as a systemd service (README.txt inside).
          **iPhone:** not included until Apple signing is set up.

          $notes

          Proof of concept: don't store real customer data before the independent security review (docs/SECURITY.md).
          EOF
          cat notes.md
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          draft: ${{ startsWith(github.ref, 'refs/tags/app-v') }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/app-v') }}
          tag_name: ${{ startsWith(github.ref, 'refs/tags/app-v') && github.ref_name || format('app-v{0}', steps.v.outputs.version) }}
          target_commitish: ${{ github.sha }}
          name: HumID apps ${{ steps.v.outputs.version }}
          body_path: notes.md
          files: dist/*
