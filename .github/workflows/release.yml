name: Release apps

# Build installable HumID apps. Pick the platforms; each builds, signs (when
# secrets exist) and uploads on its own runner.
#
#   Actions > Release apps > Run workflow > platforms: "android"  (or "all", "ios,android", …)
#   Tag app-vX.Y.Z  → all five, attached to a draft GitHub release.
#   Or tick "Publish apps" when you run it: a pre-release tagged app-v<apps/mobile version>
#   on the run's commit, with each installer and the whole bundle as one zip.
#   Every run also leaves one artifact, HumID-<version>-<server>: a "HumID <version>" folder
#   with a folder per app (Android, iPhone, Mac, Windows, Linux, Windows Server).
#
# HumID Server for Windows rides along: platforms "server-windows" builds the
# server zip on Windows, installs and smoke-tests it, and with "Publish" ticked
# creates its own release (tag server-win-v<version>). See server-windows.yml.
#
# Which vault server the apps talk to (repository variables, Settings > Secrets and variables > Actions > Variables,
# or the server_url / server_kid boxes when you run it by hand, which win over the variables):
#   HUMID_SERVER_URL   e.g. https://vault.humidsecure.ai
#   HUMID_SERVER_KID   the server's 64-hex key id (printed by deploy/setup.sh or `humid status`) — pins it in the app
#
# Signing secrets (optional; without them you still get installable test builds where the platform allows):
#   macOS + iOS: APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
#                APPLE_TEAM_ID, APPLE_API_ISSUER, APPLE_API_KEY, APPLE_API_KEY_P8 (base64)
#   Android:     ANDROID_KEYSTORE (base64 .jks), ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS
#   Windows:     WINDOWS_CERTIFICATE (base64 .pfx), WINDOWS_CERTIFICATE_PASSWORD

on:
  push:
    tags: ["app-v*"]
  workflow_dispatch:
    inputs:
      platforms:
        description: "Comma-separated: ios,android,macos,windows,linux — or all — and/or server-windows"
        default: android
        required: true
      publish_server:
        description: "With server-windows: publish it as a release (tag server-win-v<version>)"
        type: boolean
        default: false
      publish_apps:
        description: "Publish the apps as a pre-release (tag app-v<apps/mobile version> on this commit)"
        type: boolean
        default: false
      server_url:
        description: "Vault server the apps talk to, e.g. https://pd-cc.tail1234.ts.net (blank = the HUMID_SERVER_URL variable)"
        required: false
        default: ""
      server_kid:
        description: "That server's 64-hex key id from `humid status` (blank = the HUMID_SERVER_KID variable)"
        required: false
        default: ""
      simulate:
        description: "Simulation build: the vault server runs inside the app (no server needed; real biometric checks). Built as a separate app, app.humid.vault.sim / \"HumID Sim\"; can't be published as a release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      anyApps: ${{ steps.m.outputs.anyApps }}
      server: ${{ steps.m.outputs.server }}
    steps:
      # A simulation build carries the vault server inside the app. It's a demo, never a
      # release: it must not be published, and it must not install over the real app.
      - name: Refuse to publish a simulation build
        if: inputs.simulate == true && inputs.publish_apps == true
        run: |
          echo "::error::A simulation build (the server inside the app) can't be published as a release. Untick one of the two."
          exit 1
      # Desktop apps are paused (2026-10-17): a desktop gate has no hardware proof a
      # server can check, so macOS, Windows and Linux apps are not published. They can
      # still be built to test (unpublished). Set the repository variable
      # HUMID_DESKTOP_RELEASES=on to publish them again.
      - id: m
        env:
          PUBLISHING: ${{ (startsWith(github.ref, 'refs/tags/app-v') || inputs.publish_apps == true) && '1' || '' }}
          DESKTOP_RELEASES: ${{ vars.HUMID_DESKTOP_RELEASES }}
        run: |
          WANT="${{ github.event.inputs.platforms || 'all' }}"
          WANT="${WANT/all/ios,android,macos,windows,linux}"
          python3 - "$WANT" <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os, sys
          runners = {"ios": "macos-14", "macos": "macos-14", "windows": "windows-latest", "linux": "ubuntu-22.04", "android": "ubuntu-22.04"}
          want = [p.strip() for p in sys.argv[1].split(",") if p.strip()]
          server = "server-windows" in want
          apps = [p for p in want if p != "server-windows"]
          bad = [p for p in apps if p not in runners]
          if bad: sys.exit(f"Unknown platform(s): {bad}")
          desktop = [p for p in apps if p in ("macos", "windows", "linux")]
          if desktop and os.environ.get("PUBLISHING") and os.environ.get("DESKTOP_RELEASES") != "on":
              print(f"::warning::Desktop apps are paused and won't be published: left out {', '.join(desktop)}", file=sys.stderr)
              apps = [p for p in apps if p not in desktop]
          print("matrix=" + json.dumps({"include": [{"platform": p, "runner": runners[p]} for p in apps]}))
          print("anyApps=" + json.dumps(bool(apps)))
          print("server=" + json.dumps(server))
          EOF

  server-windows:
    needs: plan
    if: needs.plan.outputs.server == 'true'
    uses: ./.github/workflows/server-windows.yml
    with:
      publish: ${{ inputs.publish_server == true }}
    permissions:
      contents: write

  build:
    needs: plan
    if: needs.plan.outputs.anyApps == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    env:
      HAS_APPLE: ${{ secrets.APPLE_CERTIFICATE != '' }}
      HAS_ANDROID_KEY: ${{ secrets.ANDROID_KEYSTORE != '' }}
      HAS_WIN_CERT: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
      HUMID_SERVER_URL: ${{ inputs.server_url || vars.HUMID_SERVER_URL }}
      HUMID_SERVER_KID: ${{ inputs.server_kid || vars.HUMID_SERVER_KID }}
      HUMID_SIMULATE: ${{ inputs.simulate == true && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
        env: { NODE_NO_WARNINGS: "1" }
      # The simulation app is its own app: a different bundle identifier and name, so it
      # installs beside the real HumID, never over it, and servers (which pin the
      # identifier through attestation) never mistake it for the real one.
      - name: Simulation build · separate app identity
        if: env.HUMID_SIMULATE == '1'
        shell: bash
        run: |
          node -e '
            const fs = require("fs"); const p = "apps/mobile/src-tauri/tauri.conf.json";
            const c = JSON.parse(fs.readFileSync(p, "utf8"));
            c.identifier = "app.humid.vault.sim"; c.productName = "HumID Sim"; c.app.windows[0].title = "HumID Sim";
            fs.writeFileSync(p, JSON.stringify(c, null, 2) + "\n");
          '
          echo "::warning::Simulation build: app.humid.vault.sim / HumID Sim (the vault server runs inside the app). Not a release."
      - name: Server the app will use
        shell: bash
        run: |
          if [ -z "$HUMID_SERVER_URL" ]; then
            echo "::warning::HUMID_SERVER_URL is not set; the app will need a server URL. Set it under Settings > Secrets and variables > Actions > Variables."
          else
            if ! [[ "$HUMID_SERVER_URL" =~ ^https://[A-Za-z0-9.-]+(:[0-9]+)?$ ]]; then echo "::error::server URL must be https://host with no path, got: $HUMID_SERVER_URL"; exit 1; fi
            if [ -n "$HUMID_SERVER_KID" ] && ! [[ "$HUMID_SERVER_KID" =~ ^[0-9a-fA-F]{64}$ ]]; then echo "::error::server key id must be 64 hex characters"; exit 1; fi
            echo "Building for $HUMID_SERVER_URL (pinned key: ${HUMID_SERVER_KID:-trust on first use})"
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: >-
            ${{ matrix.platform == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin'
             || matrix.platform == 'ios' && 'aarch64-apple-ios,aarch64-apple-ios-sim'
             || matrix.platform == 'android' && 'aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android'
             || '' }}
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: apps/mobile/src-tauri }

      # ---------------- Linux ----------------
      - name: Linux · system libraries
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libdbus-1-dev rpm
      - name: Linux · build .deb .rpm .AppImage
        if: matrix.platform == 'linux'
        run: npm run tauri -- build

      # ---------------- Windows ----------------
      - name: Windows · import signing certificate
        if: matrix.platform == 'windows' && env.HAS_WIN_CERT == 'true'
        shell: pwsh
        run: |
          $pfx = "$env:RUNNER_TEMP\sign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String("${{ secrets.WINDOWS_CERTIFICATE }}"))
          $pw = ConvertTo-SecureString "${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}" -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pw
          $conf = Get-Content apps/mobile/src-tauri/tauri.conf.json | ConvertFrom-Json
          $conf.bundle.windows | Add-Member certificateThumbprint $cert.Thumbprint -Force
          $conf.bundle.windows | Add-Member digestAlgorithm "sha256" -Force
          $conf.bundle.windows | Add-Member timestampUrl "http://timestamp.digicert.com" -Force
          $conf | ConvertTo-Json -Depth 20 | Set-Content apps/mobile/src-tauri/tauri.conf.json
      - name: Windows · build .msi and setup .exe
        if: matrix.platform == 'windows'
        run: npm run tauri -- build

      # ---------------- macOS & iOS ----------------
      - name: Apple · keychain entitlement team id
        if: (matrix.platform == 'macos' || matrix.platform == 'ios') && env.HAS_APPLE == 'true'
        run: sed -i '' "s/TEAMID/${{ secrets.APPLE_TEAM_ID }}/" apps/mobile/src-tauri/Entitlements.plist
      - name: Apple · API key file
        if: (matrix.platform == 'macos' || matrix.platform == 'ios') && env.HAS_APPLE == 'true'
        run: |
          mkdir -p ~/private_keys
          echo "${{ secrets.APPLE_API_KEY_P8 }}" | base64 --decode > ~/private_keys/AuthKey_${{ secrets.APPLE_API_KEY }}.p8
          echo "APPLE_API_KEY_PATH=$HOME/private_keys/AuthKey_${{ secrets.APPLE_API_KEY }}.p8" >> "$GITHUB_ENV"
      - name: macOS · universal signed + notarised .dmg
        if: matrix.platform == 'macos' && env.HAS_APPLE == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: npm run tauri -- build --target universal-apple-darwin
      - name: macOS · unsigned build (Touch ID needs a signed build)
        if: matrix.platform == 'macos' && env.HAS_APPLE != 'true'
        run: npm run tauri -- build --target aarch64-apple-darwin --bundles app --no-sign
      - name: iOS · generate Xcode project
        if: matrix.platform == 'ios'
        run: npm run tauri -- ios init --ci
      - name: iOS · App Attest entitlement (servers verify each phone's liveness key with it)
        if: matrix.platform == 'ios'
        run: |
          ENT=$(find apps/mobile/src-tauri/gen/apple -name '*.entitlements' -not -path '*/build/*' | head -1)
          if [ -z "$ENT" ]; then echo "::error::no iOS .entitlements file after ios init"; exit 1; fi
          /usr/libexec/PlistBuddy -c "Delete :com.apple.developer.devicecheck.appattest-environment" "$ENT" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :com.apple.developer.devicecheck.appattest-environment string production" "$ENT"
          echo "App Attest (production) added to $ENT"
          # Reading passport / ID chips (the App ID needs the NFC Tag Reading capability).
          /usr/libexec/PlistBuddy -c "Delete :com.apple.developer.nfc.readersession.formats" "$ENT" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :com.apple.developer.nfc.readersession.formats array" "$ENT"
          /usr/libexec/PlistBuddy -c "Add :com.apple.developer.nfc.readersession.formats:0 string TAG" "$ENT"
          echo "NFC tag reading added to $ENT"
      - name: iOS · signed .ipa for TestFlight / App Store Connect
        if: matrix.platform == 'ios' && env.HAS_APPLE == 'true'
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: npm run tauri -- ios build --export-method app-store-connect
      - name: iOS · compile check (no Apple signing yet)
        if: matrix.platform == 'ios' && env.HAS_APPLE != 'true'
        working-directory: apps/mobile/src-tauri
        run: cargo build --release --target aarch64-apple-ios --lib

      # ---------------- Android ----------------
      # The runner's disk is too small for the NDK plus four Android Rust targets: free the
      # toolchains Android doesn't use (about 25 GB) before building.
      - name: Android · free disk space
        if: matrix.platform == 'android'
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /usr/local/share/powershell \
            /usr/local/lib/node_modules /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/go /opt/hostedtoolcache/PyPy /usr/share/swift || true
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -h / | tail -1
      - name: Android · Java 17
        if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Android · SDK (preinstalled on GitHub's Ubuntu runners) and NDK
        if: matrix.platform == 'android'
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKM" || { echo "::error::no Android SDK on this runner ($SDK)"; exit 1; }
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "ndk;27.2.12479018" "platforms;android-35" "build-tools;35.0.0" > /dev/null
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "NDK_HOME=$SDK/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
      - name: Android · generate Gradle project
        if: matrix.platform == 'android'
        run: npm run tauri -- android init --ci
      - name: Android · release signing config
        if: matrix.platform == 'android' && env.HAS_ANDROID_KEY == 'true'
        run: |
          APP=apps/mobile/src-tauri/gen/android/app
          echo "${{ secrets.ANDROID_KEYSTORE }}" | base64 --decode > $APP/release.jks
          cat > apps/mobile/src-tauri/gen/android/keystore.properties <<EOF
          storeFile=release.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          EOF
          python3 tools/android-signing.py $APP/build.gradle.kts
      - name: Android · signed release .apk + .aab
        if: matrix.platform == 'android' && env.HAS_ANDROID_KEY == 'true'
        shell: bash
        run: |
          set -o pipefail
          if ! npm run tauri -- android build --apk --aab 2>&1 | tee android-build.log; then
            # the run's logs aren't always reachable: put what went wrong in the annotations too
            # the reason, not the deprecation warnings: Gradle's "What went wrong" and the lines after it
            echo "::error::$(grep -v '^w: ' android-build.log | grep -A14 -E 'What went wrong|^e: |error:' | head -45 | tr '\n' ' ' | cut -c1-3500)"
            exit 1
          fi
      # No debug builds, ever: a debug APK is debuggable (adb run-as reads the app's data),
      # has WebView remote debugging on, allows cleartext HTTP, and logs to logcat. Without
      # the release key there is no Android build.
      - name: Android · the release signing key is required
        if: matrix.platform == 'android' && env.HAS_ANDROID_KEY != 'true'
        run: |
          echo "::error::Android builds need the release signing key: add the ANDROID_KEYSTORE, ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS secrets (RELEASING.md). HumID never ships a debug build."
          exit 1
      - name: Android · prove it's a release build signed with our key
        if: matrix.platform == 'android' && env.HAS_ANDROID_KEY == 'true'
        run: |
          APK=$(find apps/mobile/src-tauri/gen/android -name '*.apk' -path '*release*' | head -1)
          [ -n "$APK" ] || { echo "::error::no release APK was built"; exit 1; }
          BT=$(ls -d "${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK" | tee signer.txt
          grep -q "CN=HumID" signer.txt || { echo "::error::the APK isn't signed with the HumID release key"; exit 1; }
          if "$BT/aapt" dump badging "$APK" | grep -q "application-debuggable"; then echo "::error::the APK is debuggable"; exit 1; fi
          # Servers accept the certificate built into @humid/attest; a build signed with any other
          # key would be refused by every server, so it must not ship.
          GOT=$(grep -i "certificate SHA-256 digest" signer.txt | head -1 | awk '{print $NF}' | tr 'A-F' 'a-f')
          WANT=$(grep -oE 'HUMID_ANDROID_RELEASE_CERT = "[0-9a-f]{64}"' packages/attest/src/roots.js | grep -oE '[0-9a-f]{64}')
          echo "Signing certificate SHA-256: $GOT"
          [ -n "$WANT" ] && [ "$GOT" = "$WANT" ] || { echo "::error::the APK's signing certificate ($GOT) isn't the one servers accept ($WANT, packages/attest/src/roots.js)"; exit 1; }

      # ---------------- collect ----------------
      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p out
          find apps/mobile/src-tauri/target apps/mobile/src-tauri/gen -type f \
            \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.msi' -o -name '*-setup.exe' \
               -o -name '*.dmg' -o -name '*.ipa' -o -name '*.apk' -o -name '*.aab' \) \
            -not -path '*/deps/*' -exec cp {} out/ \; 2>/dev/null || true
          if [ -z "$(ls -A out)" ] && [ "${{ matrix.platform }}" = "macos" ]; then
            ( cd apps/mobile/src-tauri/target && find . -maxdepth 6 \( -name 'HumID.app' -o -name 'HumID Sim.app' \) -type d | head -1 | xargs -I{} zip -qry "$GITHUB_WORKSPACE/out/HumID-macos-unsigned.zip" {} ) || true
          fi
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: humid-${{ matrix.platform }}
          path: out/*
          if-no-files-found: warn

  # Everything this run built, as one folder per version with a folder per app
  # (Android/, iPhone/, Mac/, Windows/, Linux/, Windows Server/), a README naming
  # the server the apps are pinned to, and checksums. Download it from the run's
  # Artifacts: HumID-<version>-<server>.
  bundle:
    needs: [plan, build, server-windows]
    if: always() && needs.plan.result == 'success' # bundle whatever built, even if one platform failed
    runs-on: ubuntu-22.04
    outputs:
      name: ${{ steps.bundle.outputs.name }}
    env:
      HUMID_SERVER_URL: ${{ inputs.server_url || vars.HUMID_SERVER_URL }}
      HUMID_SERVER_KID: ${{ inputs.server_kid || vars.HUMID_SERVER_KID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: One folder per app
        id: bundle
        run: node tools/bundle-release.mjs artifacts bundle
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.bundle.outputs.name }}
          path: bundle/

  publish:
    needs: [plan, build, bundle]
    # A tag push: a draft with every platform. "Publish apps": only if every platform built.
    if: always() && needs.bundle.result == 'success' && (startsWith(github.ref, 'refs/tags/app-v') || (inputs.publish_apps == true && needs.build.result == 'success'))
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=$(node -p "require('./apps/mobile/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with: { pattern: "humid-*", path: dist, merge-multiple: true }
      - uses: actions/download-artifact@v4
        with: { name: "${{ needs.bundle.outputs.name }}", path: "bundle" }
      - name: The whole bundle as one zip
        run: |
          (cd bundle && zip -qr "../dist/${{ needs.bundle.outputs.name }}.zip" .)
          ls -la dist
      - name: Release notes
        run: |
          v='${{ steps.v.outputs.version }}'
          notes=$(awk -v v="## $v" '$0==v{f=1;next} /^## /{f=0} f' apps/mobile/CHANGELOG.md)
          cat > notes.md <<EOF
          HumID apps $v, pinned to the server named in the bundle's README.

          **Download:** \`${{ needs.bundle.outputs.name }}.zip\` has every app in its own folder, or take one installer below.
          **Android:** open the \`.apk\` on the phone and allow installing from that app. **Windows:** run the \`-setup.exe\`.
          **Linux:** \`.AppImage\`, \`.deb\` or \`.rpm\`. **Mac:** the unsigned \`.zip\` needs right-click > Open (Touch ID needs a signed build).
          **iPhone:** not included until Apple signing is set up.

          $notes

          Proof of concept: don't store real customer data before the independent security review (docs/SECURITY.md).
          EOF
          cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          draft: ${{ startsWith(github.ref, 'refs/tags/app-v') }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/app-v') }}
          tag_name: ${{ startsWith(github.ref, 'refs/tags/app-v') && github.ref_name || format('app-v{0}', steps.v.outputs.version) }}
          target_commitish: ${{ github.sha }}
          name: HumID apps ${{ steps.v.outputs.version }}
          body_path: notes.md
          files: dist/*
