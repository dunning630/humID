name: Secret scan

# Every pull request and every push to any branch: scan the commits it adds for
# secrets (gitleaks, built-in rules plus .gitleaks.toml) and refuse any signing key
# or key store file by name (PC-05: tools/android-test.keystore was committed once).
# Only the new commits are scanned; the history before them is the maintainer's
# cleanup (docs/INCIDENT-2026-10-android-test-key.md).

on:
  pull_request:
  push:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      # sha256 of gitleaks_8.30.1_linux_x64.tar.gz, from the release's gitleaks_8.30.1_checksums.txt
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (pinned version, checksum verified)
        run: |
          set -euo pipefail
          tgz="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$tgz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tgz}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/$tgz" -C "$RUNNER_TEMP/gitleaks" gitleaks
          "$RUNNER_TEMP/gitleaks/gitleaks" version
      - name: Commits to scan
        id: range
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            range="$PR_BASE..$PR_HEAD"
          elif [ -n "$BEFORE" ] && ! [[ "$BEFORE" =~ ^0+$ ]] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..$SHA"
          else
            # a new branch (or a force-push over history we no longer have): what isn't on main yet.
            # fetch-depth 0 already brought origin/main (no second fetch: the token isn't kept).
            if git rev-parse -q --verify "origin/main^{commit}" >/dev/null; then range="origin/main..$SHA"; else range="$SHA^!"; fi
          fi
          echo "Scanning $range: $(git rev-list --count "$range") commit(s)"
          echo "range=$range" >> "$GITHUB_OUTPUT"
      - name: No signing key or key store files
        env:
          RANGE: ${{ steps.range.outputs.range }}
        run: |
          set -euo pipefail
          bad=$(git log --format= --name-only --diff-filter=ACMR "$RANGE" | sort -u \
            | grep -iE '\.(keystore|jks|p12|pfx|p8)$|(^|/)keystore\.properties$|(^|/)\.env$' || true)
          if [ -n "$bad" ]; then
            echo "::error title=signing key or secrets file committed::$(echo "$bad" | tr '\n' ' ')"
            echo "Remove these files from the commits (rewrite the branch) and rotate anything they contained."
            exit 1
          fi
      - name: gitleaks
        env:
          RANGE: ${{ steps.range.outputs.range }}
        run: |
          "$RUNNER_TEMP/gitleaks/gitleaks" git . --config .gitleaks.toml --redact --no-banner --exit-code 1 --log-opts="$RANGE" -v
