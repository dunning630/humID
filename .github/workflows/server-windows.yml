name: Release HumID Server for Windows

# Publishes HumID-Server-Windows-<version>.zip as a GitHub release, so every
# version is kept and downloadable from the repository's Releases page.
#
#   1. Bump deploy/windows/package.json and add a CHANGELOG entry.
#   2. Either push a tag:  git tag server-win-v1.0.1 && git push origin server-win-v1.0.1
#      or click: Actions > Release apps > Run workflow > platforms "server-windows",
#      tick "publish" (it tags the chosen branch's commit for you). Once this file
#      is on main it also has its own Run workflow button.
#
# The zip is built on Windows, installed and smoke-tested there first; the
# release is only created if that passes. The tag must match the version.
#
# The release is created as a DRAFT with the unsigned zip. The admin console installs
# only zips signed with the maintainer's offline release key (ML-DSA-87; pinned in
# deploy/windows/admin/release-keys.mjs), which CI never holds. To finish (RELEASING.md):
#   3. download the zip from the draft, on the offline computer run
#        node tools/release-key.mjs sign HumID-Server-Windows-<version>.zip --key <key file>
#   4. upload HumID-Server-Windows-<version>.zip.sig to the draft, then publish it.
# Publishing refuses to start while release-keys.mjs pins no key.

on:
  push:
    tags: ["server-win-v*"]
  workflow_call: # from release.yml (platforms: server-windows)
    inputs:
      publish:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a release (tag server-win-v<version> on this commit). Unticked: build and test only."
        type: boolean
        default: false

# Least privilege (PC-20 / SRV-35): the job that installs dependencies and builds has a
# read-only token, no persisted git credentials and no dependency install scripts; only
# the publish job, which installs nothing, may write (create the draft release).
permissions: {}

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      HUMID: C:\Program Files\HumID Server\humid.ps1
      NODE_NO_WARNINGS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      # setup-node v4 has no automatic cache, and none is configured (zizmor assumes v5's default)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0  # zizmor: ignore[cache-poisoning]
        with: { node-version: 22 } # no cache: this job builds what gets released
      - run: npm ci --ignore-scripts # no dependency install scripts (esbuild's binary comes from its optional dependency)
      - name: A release key is pinned (the console refuses unsigned updates; see release-keys.mjs)
        if: github.ref_type == 'tag' || inputs.publish
        shell: bash
        run: |
          node --input-type=module -e "
            import { RELEASE_KEYS } from './deploy/windows/admin/release-keys.mjs';
            if (!RELEASE_KEYS.length) {
              console.error('deploy/windows/admin/release-keys.mjs pins no HumID release key, so every server would refuse this release. Run tools/release-key.mjs keygen offline and pin its public key first (RELEASING.md).');
              process.exit(1);
            }
            console.log(RELEASE_KEYS.length + ' release key(s) pinned.');
          "
      - name: Version matches the tag
        id: version
        shell: pwsh
        run: |
          $v = (Get-Content deploy/windows/package.json | ConvertFrom-Json).version
          "version=$v" >> $env:GITHUB_OUTPUT
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "server-win-v$v") {
            throw "Tag $env:GITHUB_REF_NAME doesn't match deploy/windows/package.json version $v"
          }
      - name: Build
        shell: pwsh
        run: |
          node deploy/windows/build.mjs --zip
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # never a test build (one whose console trusts a test release key)
          if (Select-String -Path deploy/windows/out/HumID-Server/VERSION.txt -Pattern 'TEST BUILD' -Quiet) { throw 'this is a test build; it must not be released' }
      - name: Install from the zip and smoke-test (as a person would)
        shell: pwsh
        run: |
          Expand-Archive -Path deploy/windows/out/HumID-Server-Windows-*.zip -DestinationPath "$env:RUNNER_TEMP\pkg"
          powershell -NoProfile -ExecutionPolicy Bypass -File "$env:RUNNER_TEMP\pkg\HumID-Server\humid.ps1" install -Quiet
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node tests/smoke.mjs http://127.0.0.1:8480
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $ok = $false
          for ($i = 0; $i -lt 30 -and -not $ok; $i++) { try { $ok = (Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8490/healthz -TimeoutSec 3).StatusCode -eq 200 } catch { Start-Sleep 2 } }
          if (-not $ok) { throw "the admin console (HumID Admin) didn't start" }
          powershell -NoProfile -ExecutionPolicy Bypass -File $env:HUMID set HUMID_DEVICE_POLICY=biometric
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $code = (powershell -NoProfile -ExecutionPolicy Bypass -File $env:HUMID mint 1 ci | Select-String 'HA-[0-9A-Z-]+' | Select-Object -Last 1).Matches.Value
          if (-not $code) { throw "humid mint printed no access code" }
          $out = node tests/smoke.mjs http://127.0.0.1:8480 $code
          $out
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if (-not ($out -match 'blind-signed pass')) { throw "the full flow didn't run with an access pass" }
          powershell -NoProfile -ExecutionPolicy Bypass -File $env:HUMID uninstall -RemoveData -Quiet
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Log on failure
        if: failure()
        shell: pwsh
        run: Get-Content C:\ProgramData\HumID\logs\humid-server.log -Tail 150 -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2 · also when publishing: Release apps bundles it
        with:
          name: HumID-Server-Windows
          path: deploy/windows/out/HumID-Server-Windows-*.zip

  publish:
    needs: build
    if: github.ref_type == 'tag' || inputs.publish
    runs-on: ubuntu-22.04
    permissions:
      contents: write # the only job that may create the (draft) release; it installs and runs no dependencies
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false, sparse-checkout: deploy/windows/CHANGELOG.md, sparse-checkout-cone-mode: false }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { name: HumID-Server-Windows, path: out }
      - name: Release notes from the changelog
        shell: pwsh
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          $v = $env:VERSION
          if ($v -notmatch '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$') { throw "unexpected version '$v'" }
          $log = Get-Content deploy/windows/CHANGELOG.md -Raw
          $m = [regex]::Match($log, "(?ms)^## $([regex]::Escape($v))\s*\r?\n(.*?)(?=^## |\z)")
          $notes = if ($m.Success) { $m.Groups[1].Value.Trim() } else { '' }
          @"
          HumID Server for Windows $($v): the HumID vault server on one Windows 10/11 PC, no Docker.

          **Install:** download the zip, right-click > Properties > Unblock, Extract All, then double-click ``Install HumID Server.cmd``. Steps are in ``README.txt`` inside the zip.

          $notes

          **Signed:** ``HumID-Server-Windows-$($v).zip.sig`` is its signature by the HumID release key (ML-DSA-87). The admin console installs it only if that signature checks out against the key it pins; check it by hand with ``node tools/release-key.mjs verify HumID-Server-Windows-$($v).zip``.

          Proof of concept: don't store real customer data before the independent security review (docs/SECURITY.md).
          "@ | Set-Content -Encoding utf8 "$env:RUNNER_TEMP/notes.md"
          Get-Content "$env:RUNNER_TEMP/notes.md"
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: server-win-v${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: HumID Server for Windows ${{ needs.build.outputs.version }}
          body_path: ${{ runner.temp }}/notes.md
          # A draft, unsigned: the maintainer signs the zip offline, uploads the .sig and
          # publishes (RELEASING.md). Consoles never see drafts, and refuse unsigned zips.
          draft: true
          prerelease: false
          files: out/HumID-Server-Windows-*.zip
