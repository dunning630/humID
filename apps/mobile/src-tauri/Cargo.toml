[package]
name = "humid"
version = "1.0.0"
description = "HumID Vault"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "humid_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-fs = "2.7"
tauri-plugin-opener = "2.7"
tauri-plugin-humid-gate = { path = "../../../plugins/humid-gate" }
tauri-plugin-humid-nfc = { path = "../../../plugins/humid-nfc" }
tauri-plugin-humid-docscan = { path = "../../../plugins/humid-docscan" }
percent-encoding = "2.3"

[lints]
workspace = true
