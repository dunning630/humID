# cargo-deny for the whole workspace (CI `rust` job: cargo deny --all-features check).
# https://embarkstudios.github.io/cargo-deny/
#
# Advisories (RustSec), licences, banned or duplicate crates, and where crates may come from.

[graph]
# The app ships to iPhone and Android only (desktop apps are paused for 5.0); the Linux
# targets are where CI builds and tests the workspace. Crates only other platforms pull in
# are not checked.
targets = [
  "aarch64-apple-ios",
  "aarch64-linux-android",
  "x86_64-linux-android",
  "x86_64-unknown-linux-gnu",
]
all-features = true

[advisories]
# Every vulnerability fails; unmaintained and unsound notices too, for crates we use directly
# or that sit in the app's process. Exceptions go here, each with the reason and an issue.
yanked = "deny"
unmaintained = "workspace"
ignore = [
  # RUSTSEC-2023-0071 (Marvin: the `rsa` crate's private-key operations aren't constant
  # time). Pulled in by `blind-rsa-signatures`, which the anon unit uses to sign blinded
  # access passes and post tokens (RFC 9474), so the server does run private-key operations
  # on caller-chosen inputs. Accepted for development only: replace the signing side with a
  # constant-time implementation before any production deployment (SERVER.md §12).
  { id = "RUSTSEC-2023-0071", reason = "anon unit blind RSA signing; development only, replace before production (SERVER.md §12)" },
]

[licenses]
# What the dependency tree uses today, all permissive. A new licence fails CI until it is
# reviewed and added here. Our own crates are UNLICENSED and unpublished (private).
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "ISC",
  "MIT",
  "MPL-2.0",
  "OpenSSL", # aws-lc-sys (rustls's crypto provider), alongside ISC and Apache-2.0
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.9

[licenses.private]
ignore = true

[bans]
# Two versions of one crate are common in the Tauri tree and not an error; wildcards are.
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
