# HumID server stack.  cd deploy && ./setup.sh   (first time)
#                      docker compose up -d      (afterwards)
#
# Only the edge is reachable from outside. Every other service sits on an
# internal network with no route to the internet, runs read-only, as non-root,
# with all Linux capabilities dropped, and owns its own data volume. One small
# sidecar, attestation-status, may call out: it fetches Google's list of revoked
# Android attestation keys and hands it to identity through a shared volume. It
# is on the public network only, holds no keys and can't reach any service.

name: humid

x-service: &service
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  networks: [internal]
  environment: &env
    HUMID_INTERNAL_PK: ${HUMID_INTERNAL_PK:?run ./setup.sh first}
  healthcheck: &health
    interval: 10s
    timeout: 3s
    retries: 5

services:
  # Hardened like the others (PC-21): read-only, non-root, no capabilities. The container's
  # own network namespace lets an unprivileged user bind 80 and 443 (Docker's default since
  # 20.10, stated here), so Caddy needs no CAP_NET_BIND_SERVICE. Its certificates and
  # state live on its two volumes.
  edge:
    <<: *service
    image: ${HUMID_REGISTRY:-ghcr.io/dunning630}/humid-edge:${HUMID_VERSION:-latest}
    build: { context: .., dockerfile: services/edge/Dockerfile }
    user: "65532:65532"
    sysctls: { net.ipv4.ip_unprivileged_port_start: 0 }
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      HUMID_DOMAIN: ${HUMID_DOMAIN:?set HUMID_DOMAIN in deploy/.env}
    volumes: [caddy-data:/data, caddy-config:/config]
    tmpfs: ["/tmp"]
    networks: [public, internal]
    healthcheck: { disable: true } # as before: the gateway's health is what the edge waits on
    depends_on:
      gateway: { condition: service_healthy }

  gateway:
    <<: *service
    image: ${HUMID_REGISTRY:-ghcr.io/dunning630}/humid-gateway:${HUMID_VERSION:-latest}
    build: { context: .., dockerfile: services/Dockerfile, args: { SERVICE: gateway } }
    environment:
      HUMID_INTERNAL_SK: ${HUMID_INTERNAL_SK:?run ./setup.sh first}
      PORT: "8080"
      IDENTITY_URL: http://identity:8081
      VAULT_URL: http://vault:8082
      LEDGER_URL: http://ledger:8083
      RECOVERY_URL: http://recovery:8084
      ACCESS_URL: http://access:8085
      KEYSHARE_URL: http://keyshare:8086
      # Person to person (4.1 preview, docs/MESSAGING.md): off until you set HUMID_RELAY_URL=http://relay:8087
      # in deploy/.env. Every request, approval and message then needs a live check. Keep it off on
      # anything holding real data until the independent review.
      RELAY_URL: ${HUMID_RELAY_URL:-}
      TRUST_PROXY: "1"
      # Which devices may join and sign in. Every check is a live face or fingerprint; never a PIN.
      #   attested  (default) phones whose secure chip proves each check (Android key attestation, Apple App Attest)
      #   biometric also biometric-only desktops (Touch ID, fingerprint readers) that can't prove it
      #   demo      local testing only: accepts a device with no sensor
      HUMID_DEVICE_POLICY: ${HUMID_DEVICE_POLICY:-attested}
      # Who may create a HumID (docs/ANONYMITY.md):
      #   pass  (default) only with an access pass, paid for with an access code and signed
      #         blind, so no one, HumID included, can link the payment to the account
      #   open  anyone
      HUMID_REGISTRATION: ${HUMID_REGISTRATION:-pass}
      HUMID_PASS_BUY_URL: ${HUMID_PASS_BUY_URL:-}                   # https page where people buy access codes; the app links to it
      # Check-in (docs/CHECKIN.md): a holder can arm a timer that erases their vault unless they
      # check in every hour or two. off (default) until push reminders exist. With it on, a restart
      # of keyshare erases every armed vault: its fuse keys live in memory only.
      HUMID_CHECKIN: ${HUMID_CHECKIN:-off}
      HUMID_ALLOWED_ORIGINS: ${HUMID_ALLOWED_ORIGINS:-tauri://localhost,http://tauri.localhost,https://tauri.localhost}
    volumes: [gateway-data:/data]
    healthcheck:
      <<: *health
      test: ["CMD", "/nodejs/bin/node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
    depends_on:
      identity: { condition: service_healthy }
      vault: { condition: service_healthy }
      ledger: { condition: service_healthy }
      recovery: { condition: service_healthy }
      access: { condition: service_healthy }
      keyshare: { condition: service_healthy }
      relay: { condition: service_healthy }

  identity:
    <<: *service
    image: ${HUMID_REGISTRY:-ghcr.io/dunning630}/humid-identity:${HUMID_VERSION:-latest}
    build: { context: .., dockerfile: services/Dockerfile, args: { SERVICE: identity } }
    environment:
      <<: *env
      PORT: "8081"
      # Hardware proof of each phone's liveness key (docs/SECURITY.md).
      HUMID_ANDROID_PACKAGES: ${HUMID_ANDROID_PACKAGES:-app.humid.vault}
      HUMID_ANDROID_CERT_DIGESTS: ${HUMID_ANDROID_CERT_DIGESTS:-}   # the official HumID app is always accepted; add your own signing cert's SHA-256 if you build your own
      HUMID_IOS_APP_ID: ${HUMID_IOS_APP_ID:-}                       # "<Apple Team ID>.app.humid.vault"; empty = no iPhones
      HUMID_APP_ATTEST_ENV: ${HUMID_APP_ATTEST_ENV:-production}     # "development" for Xcode debug builds
      HUMID_REQUIRE_LOCKED_BOOT: ${HUMID_REQUIRE_LOCKED_BOOT:-1}    # refuse rooted / unlocked-bootloader Android phones
      HUMID_ANDROID_MIN_PATCH: ${HUMID_ANDROID_MIN_PATCH:-}        # optional minimum Android security patch, YYYYMM
      # Google's revoked-key list, as the attestation-status sidecar last fetched it. With the
      # attested policy an Android phone is refused while that copy is missing or over 48 hours
      # old (status_unavailable / status_stale). 0 accepts it unchecked instead (not recommended).
      HUMID_ATTESTATION_STATUS_FILE: /status/attestation-status.json
      HUMID_ATTESTATION_STATUS_REQUIRED: ${HUMID_ATTESTATION_STATUS_REQUIRED:-1}
      HUMID_DEVICE_POLICY: ${HUMID_DEVICE_POLICY:-attested}         # the gateway's; identity logs its live-human posture with it
      # Test servers only: accept an Android app signed by anyone. Refused with the attested
      # policy unless HUMID_INSECURE_TEST=1 is also set; logged as a warning at every start.
      HUMID_ANDROID_ALLOW_ANY_SIGNER: ${HUMID_ANDROID_ALLOW_ANY_SIGNER:-0}
      HUMID_INSECURE_TEST: ${HUMID_INSECURE_TEST:-0}
      HUMID_DURESS_COOLOFF_MS: ${HUMID_DURESS_COOLOFF_MS:-86400000}  # calm period before the owner can lift a duress lockdown
    volumes: [identity-data:/data, attestation-status:/status:ro]
    healthcheck:
      <<: *health
      test: ["CMD", "/nodejs/bin/node", "-e", "fetch('http://127.0.0.1:8081/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]

  # Fetches https://android.googleapis.com/attestation/status every 6 hours (sooner after a
  # failure) and writes it to the attestation-status volume, which identity reads. The
  # identity image's own code (server.mjs status-fetch); no keys, no data, no internal network.
  attestation-status:
    <<: *service
    image: ${HUMID_REGISTRY:-ghcr.io/dunning630}/humid-identity:${HUMID_VERSION:-latest}
    build: { context: .., dockerfile: services/Dockerfile, args: { SERVICE: identity } }
    command: ["server.mjs", "status-fetch"]
    networks: [public]
    environment:
      HUMID_ATTESTATION_STATUS_FILE: /status/attestation-status.json
    volumes: [attestation-status:/status]
    healthcheck:
      <<: *health
      interval: 60s
      start_period: 60s
      # healthy once a copy younger than 48 hours is on the volume
      test: ["CMD", "/nodejs/bin/node", "-e", "try{const j=JSON.parse(require('fs').readFileSync('/status/attestation-status.json','utf8'));process.exit(Date.now()-Date.parse(j.fetchedAt)<1728e5?0:1)}catch{process.exit(1)}"]

  vault:
    <<: *service
    image: ${HUMID_REGISTRY:-ghcr.io/dunning630}/humid-vault:${HUMID_VERSION:-latest}
    build: { context: .., dockerfile: services/Dockerfile, args: { SERVICE: vault } }
    environment: { <<: *env, PORT: "8082", VAULT_QUOTA_BYTES: "${VAULT_QUOTA_BYTES:-262144000}" }
    volumes: [vault-data:/data]
    healthcheck:
      <<: *health
      test: ["CMD", "/nodejs/bin/node", "-e", "fetch('http://127.0.0.1:8082/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]

  ledger:
    <<: *service
    image: ${HUMID_REGISTRY:-ghcr.io/dunning630}/humid-ledger:${HUMID_VERSION:-latest}
    build: { context: .., dockerfile: services/Dockerfile, args: { SERVICE: ledger } }
    environment: { <<: *env, PORT: "8083", HUMID_TLOG_COSIGNERS: "${HUMID_TLOG_COSIGNERS:-}" }
    volumes: [ledger-data:/data]
    healthcheck:
      <<: *health
      test: ["CMD", "/nodejs/bin/node", "-e", "fetch('http://127.0.0.1:8083/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]

  # Device links, two-proof recovery (seal card, witnesses, ID anchor), stations, duress.
  # Holds ciphertext and public keys; the anchor part is encrypted under the holder's ID.
  recovery:
    <<: *service
    image: ${HUMID_REGISTRY:-ghcr.io/dunning630}/humid-recovery:${HUMID_VERSION:-latest}
    build: { context: .., dockerfile: services/Dockerfile, args: { SERVICE: recovery } }
    environment:
      <<: *env
      PORT: "8084"
      RECOVERY_DELAY_MS: "${RECOVERY_DELAY_MS:-259200000}"
      HUMID_CSCA_DIR: /csca                                          # country signing certificates for ID chips (deploy/csca)
      HUMID_STATION_ACCOUNTS: "${HUMID_STATION_ACCOUNTS:-}"          # hid_… accounts that run verification stations
    volumes: [recovery-data:/data, ./csca:/csca:ro]
    healthcheck:
      <<: *health
      test: ["CMD", "/nodejs/bin/node", "-e", "fetch('http://127.0.0.1:8084/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]

  # Anonymous payment: access codes, blind-signed passes, spent passes. Knows no accounts.
  # Mint codes to sell:  docker compose run --rm access server.mjs mint 100 counter-oct
  access:
    <<: *service
    image: ${HUMID_REGISTRY:-ghcr.io/dunning630}/humid-access:${HUMID_VERSION:-latest}
    build: { context: .., dockerfile: services/Dockerfile, args: { SERVICE: access } }
    environment:
      <<: *env
      PORT: "8085"
      HUMID_PASS_ISSUE_DAYS: ${HUMID_PASS_ISSUE_DAYS:-365}          # a new pass key each period
      HUMID_PASS_ACCEPT_DAYS: ${HUMID_PASS_ACCEPT_DAYS:-545}        # how long a key's passes stay spendable
      HUMID_STAMP_EPOCH_MINUTES: ${HUMID_STAMP_EPOCH_MINUTES:-60}   # 4.0 live stamps: their own keys, never the pass key, a new one each epoch
      HUMID_STAMP_ACCEPT_DAYS: ${HUMID_STAMP_ACCEPT_DAYS:-15}       # how long a retired stamp key's message stamps count (relay keeps 14 days)
    volumes: [access-data:/data]
    healthcheck:
      <<: *health
      test: ["CMD", "/nodejs/bin/node", "-e", "fetch('http://127.0.0.1:8085/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]

  # Split keys: each document's second key, released one document at a time inside a live
  # step-up. Never sees envelopes; the vault never sees these keys. Put its volume on
  # different storage from vault-data (docs/SECURITY.md#compromised-phone).
  keyshare:
    <<: *service
    image: ${HUMID_REGISTRY:-ghcr.io/dunning630}/humid-keyshare:${HUMID_VERSION:-latest}
    build: { context: .., dockerfile: services/Dockerfile, args: { SERVICE: keyshare } }
    environment:
      <<: *env
      PORT: "8086"
      HUMID_SHARE_RELEASES_PER_HOUR: ${HUMID_SHARE_RELEASES_PER_HOUR:-120}
    volumes: [keyshare-data:/data]
    healthcheck:
      <<: *health
      test: ["CMD", "/nodejs/bin/node", "-e", "fetch('http://127.0.0.1:8086/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]

  # Person to person (4.0): mailboxes of fixed-size ciphertext. No accounts, no senders, no keys.
  # Reached only from app sessions that never sign in, so nothing here links an account to a mailbox.
  relay:
    <<: *service
    image: ${HUMID_REGISTRY:-ghcr.io/dunning630}/humid-relay:${HUMID_VERSION:-latest}
    build: { context: .., dockerfile: services/Dockerfile, args: { SERVICE: relay } }
    environment:
      <<: *env
      PORT: "8087"
      HUMID_RELAY_MAX_TOTAL_BYTES: ${HUMID_RELAY_MAX_TOTAL_BYTES:-2147483648}
      HUMID_RELAY_MAX_NET_BYTES_DAY: ${HUMID_RELAY_MAX_NET_BYTES_DAY:-50331648}  # per network (IPv4 address, IPv6 /64 and /48)
      HUMID_RELAY_MAX_BLOCK_BYTES_DAY: ${HUMID_RELAY_MAX_BLOCK_BYTES_DAY:-134217728}  # per IPv4 /24 or IPv6 /32, all addresses together
      HUMID_RELAY_FAIR_ABOVE: ${HUMID_RELAY_FAIR_ABOVE:-0.75}  # past this share of the total, only blocks under a fair share deposit
    volumes: [relay-data:/data]
    healthcheck:
      <<: *health
      test: ["CMD", "/nodejs/bin/node", "-e", "fetch('http://127.0.0.1:8087/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]

networks:
  public: {}
  internal: { internal: true }

volumes:
  caddy-data: {}
  caddy-config: {}
  attestation-status: {}
  gateway-data: {}
  identity-data: {}
  vault-data: {}
  ledger-data: {}
  recovery-data: {}
  access-data: {}
  keyshare-data: {}
  relay-data: {}
