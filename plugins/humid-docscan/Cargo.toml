[package]
name = "tauri-plugin-humid-docscan"
version = "1.0.1"
description = "HumID document capture on Android: opens the phone's on-device document scanner (Google Play services, ML Kit) for one page and hands back the flattened photo. Holds nothing and reads nothing; the picture never leaves the phone."
edition.workspace = true
rust-version.workspace = true
links = "tauri-plugin-humid-docscan"
license.workspace = true
publish.workspace = true

[dependencies]
tauri = "2.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-plugin = { version = "2.7", features = ["build"] }

[lints]
workspace = true
