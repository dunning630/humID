[package]
name = "tauri-plugin-humid-docscan"
version = "2.0.0"
description = "HumID document camera (iPhone AVFoundation + Vision, Android CameraX): a native preview behind the web view, real autofocus and focus state, document detection, the PDF417 barcode and the MRZ lines read in the pipeline, and a zero-shutter-lag still cut to the document. Holds no secrets; frames stay in memory and the still is handed over once."
edition = "2021"
rust-version = "1.77"
links = "tauri-plugin-humid-docscan"
license = "UNLICENSED"
publish = false

[dependencies]
tauri = "2.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[build-dependencies]
tauri-plugin = { version = "2.7", features = ["build"] }
