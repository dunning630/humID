[package]
name = "tauri-plugin-humid-gate"
version = "1.0.0"
description = "HumID biometric interrupt: releases a 32-byte secret only after an OS biometric check."
edition = "2021"
rust-version = "1.77"
links = "tauri-plugin-humid-gate"
license = "UNLICENSED"
publish = false

[dependencies]
tauri = "2.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
zeroize = "1.9"
getrandom = "0.3"
sha2 = "0.10"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "3.7", features = ["OSX_10_15"] }
core-foundation = "0.10"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-local-authentication = { version = "0.3", features = ["LAContext"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Foundation",
  "Security_Credentials",
  "Security_Cryptography",
  "Storage_Streams",
] }
windows-future = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["tokio"] }
secret-service = { version = "5.2", features = ["rt-tokio-crypto-rust"] }
futures-util = { version = "0.3", default-features = false }
tokio = { version = "1", features = ["time"] }

[build-dependencies]
tauri-plugin = { version = "2.7", features = ["build"] }
