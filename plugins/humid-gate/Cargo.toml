[package]
name = "tauri-plugin-humid-gate"
version = "2.0.1"
description = "HumID biological interrupt: releases a 32-byte secret only after a live face or fingerprint check; on phones a hardware liveness key signs each check."
edition = "2021"
rust-version = "1.77"
links = "tauri-plugin-humid-gate"
license = "UNLICENSED"
publish = false

[dependencies]
tauri = "2.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
zeroize = "1.9"
getrandom = "0.3"
sha2 = "0.10"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "3.7", features = ["OSX_10_15"] }
core-foundation = "0.10"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-local-authentication = { version = "0.3", features = ["LAContext"] }

# Windows: WinBio, DPAPI and token calls are declared directly in src/desktop/windows.rs.

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["tokio"] }
secret-service = { version = "5.2", features = ["rt-tokio-crypto-rust"] }
futures-util = { version = "0.3", default-features = false }
tokio = { version = "1", features = ["time"] }

[build-dependencies]
tauri-plugin = { version = "2.7", features = ["build"] }
