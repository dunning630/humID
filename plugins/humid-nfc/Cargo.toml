[package]
name = "tauri-plugin-humid-nfc"
version = "1.0.0"
description = "HumID chip reader transport: moves ISO 7816 APDUs between @humid/emrtd and a passport or ID card chip (iPhone CoreNFC, Android IsoDep, desktop PC/SC readers). Holds no keys and parses nothing."
edition = "2021"
rust-version = "1.77"
links = "tauri-plugin-humid-nfc"
license = "UNLICENSED"
publish = false

[dependencies]
tauri = "2.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
getrandom = "0.3"

# Desktop USB / built-in contactless readers through PC/SC: WinSCard on Windows, the PCSC
# framework on macOS. (Linux would need libpcsclite at run time; not shipped yet.)
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
pcsc = "2.9"

[target.'cfg(target_os = "linux")'.dependencies]
pcsc = { version = "2.9", optional = true }

[features]
# Build the PC/SC reader on Linux too (the app then needs pcsc-lite installed to start).
pcsc-linux = ["dep:pcsc"]

[build-dependencies]
tauri-plugin = { version = "2.7", features = ["build"] }
