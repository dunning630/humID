[package]
name = "humid-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
license = "UNLICENSED"
description = "HumID 5.0 server: the front, core, keys and anon units (docs/v5/SERVER.md)."

[features]
# Test support (a simulated phone, an in-process cluster). Never in a release build.
testkit = []

[[bin]]
name = "humid-server-front"
path = "src/bin/front.rs"

[[bin]]
name = "humid-server-core"
path = "src/bin/core.rs"

[[bin]]
name = "humid-server-keys"
path = "src/bin/keys.rs"

[[bin]]
name = "humid-server-anon"
path = "src/bin/anon.rs"

[dependencies]
# All HumID cryptography: the one HUMID-PQ2 suite (branch v5-core, merged into v5-server).
humid-pq2 = { path = "../../crates/humid-pq2" }

# HTTP: axum's router over hyper 1; TLS accepted by hand so the unit can read the peer certificate.
tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "io-util"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "query"] }
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "http1", "client-legacy", "service"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "aws-lc-rs"] }
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
bytes = "1"

# TLS: rustls over aws-lc-rs (ML-KEM-1024, P-384, ML-DSA-87 certificates).
rustls = { version = "0.23.31", default-features = false, features = ["aws_lc_rs", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs"] }
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["aws-lc-rs", "std"] }
aws-lc-rs = "1.18"
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "aws_lc_rs_unstable", "pem", "crypto"] }
time = "0.3"

# Database
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
deadpool-postgres = "0.14"

# Anonymous passes and post tokens: RFC 9474 blind RSA.
blind-rsa-signatures = "0.18"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
base64 = "0.22"
hex = "0.4"
zeroize = { version = "1.9", features = ["alloc"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

[dev-dependencies]
humid-server = { path = ".", features = ["testkit"] }

[lints.rust]
unsafe_code = "forbid"

# ML-DSA-87 and SLH-DSA-SHA2-256s are slow unoptimised; build dependencies at -O3 even in dev.
# (When the root workspace lands, these profile tables move to the root Cargo.toml.)
[profile.dev.package."*"]
opt-level = 3
[profile.dev]
opt-level = 1

# Temporary: builds standalone until the root workspace (members crates/*, server/*) is merged;
# drop this table then.
[workspace]
