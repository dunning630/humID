[package]
name = "humid-server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "HumID 5.0 server: the front, core, keys and anon units (docs/v5/SERVER.md)."

[features]
# Test support (a simulated phone, an in-process cluster, the app's HTP/2 link). Never in a
# release build.
testkit = ["dep:humid-link", "humid-attest/testkit"]

[[bin]]
name = "humid-server-front"
path = "src/bin/front.rs"

[[bin]]
name = "humid-server-core"
path = "src/bin/core.rs"

[[bin]]
name = "humid-server-keys"
path = "src/bin/keys.rs"

[[bin]]
name = "humid-server-anon"
path = "src/bin/anon.rs"

[dependencies]
# All HumID cryptography: the one HUMID-PQ2 suite (crates/humid-pq2, a workspace member).
humid-pq2 = { path = "../../crates/humid-pq2" }
# HTP/2, the app transport (docs/v5/HTP2.md): terminated inside core and anon.
humid-htp = { path = "../../crates/humid-htp" }
# The app core's HTP/2 client: the testkit's simulated phone drives every flow through it.
humid-link = { path = "../../crates/humid-link", optional = true }
# Phone attestation: Android key attestation, App Attest and its per-check assertions, Google's
# status list (the port of packages/attest).
humid-attest = { path = "../../crates/humid-attest" }

# HTTP: axum's router over hyper 1; TLS accepted by hand so the unit can read the peer certificate.
tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "io-util"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "query"] }
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "http1", "client-legacy", "service"] }
# native-tokio: the system's roots, for the one outbound fetch (Google's attestation status list)
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "aws-lc-rs", "native-tokio"] }
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
bytes = "1"

# TLS: rustls over aws-lc-rs (ML-KEM-1024, P-384, ML-DSA-87 certificates).
rustls = { version = "0.23.31", default-features = false, features = ["aws_lc_rs", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs"] }
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["aws-lc-rs", "std"] }
aws-lc-rs = "1.18"
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "aws_lc_rs_unstable", "pem", "crypto"] }
time = "0.3"

# Database
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
deadpool-postgres = "0.14"

# Anonymous passes and post tokens: RFC 9474 blind RSA.
blind-rsa-signatures = "0.18"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
base64 = "0.22"
hex = "0.4"
zeroize = { version = "1.9", features = ["alloc"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

[dev-dependencies]
humid-server = { path = ".", features = ["testkit"] }
# cross-checks: the server parses exactly what the phone's core emits (share requests)
humid-core = { path = "../../crates/humid-core", features = ["software-gate"] }
# the app's HTP/2 client, driven directly by the transport tests
humid-link = { path = "../../crates/humid-link" }

# shared lints (clippy -D warnings in CI); unsafe is forbidden in the crate root (lib.rs)
[lints]
workspace = true
